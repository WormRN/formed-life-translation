name: FLT Engine 2.2 Colossians 1:15-23 blind candidates
run-name: Colossians 1:15-23 manifest-authorized blind A/B/C

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/phase4-col1-015-023-sense-drafts.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase4-col1-015-023-sense-drafts.yml'

permissions:
  contents: write

concurrency:
  group: flt-col-01-015-023-blind-draft
  cancel-in-progress: false

env:
  TASK_ID: COL-01-015-023-BLIND-DRAFT-01
  AUTHORIZATION_ID: HE-COL-01-015-023-START-20260811
  LAUNCH_NONCE: HE-COL-01-015-023-AUTO-20260811-01
  EXPECTED_MANIFEST_REVISION: '1'

jobs:
  validate:
    if: github.event_name == 'pull_request'
    name: Validate accepted handoff and 1:15-23 source gate with zero provider calls
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: phase4-harness/package-lock.json
      - name: Validate governance, acceptance, authorization, source gate, and harness
        shell: bash
        run: |
          set -euo pipefail
          jq -e '.manifest_revision == 22 and .state.status == "completed" and .editorial_decisions.final_text_status == "ACCEPTED" and .editorial_decisions.audit_override.status == "confirmed"' config/passages/COL-01-001-014.json
          jq -e --arg task "$TASK_ID" --arg auth "$AUTHORIZATION_ID" --arg nonce "$LAUNCH_NONCE" --argjson rev "$EXPECTED_MANIFEST_REVISION" '
            .manifest_revision == $rev and .unit.unit_id == "COL-01-015-023" and .unit.engine_version == "2.2" and
            .state.status == "ready" and .state.active_job_id == null and .state.provider_dispatch_allowed == true and
            .jobs[$task].status == "authorized_ready" and .jobs[$task].authorization_id == $auth and
            .jobs[$task].provider_attempts_used == 0 and .jobs[$task].checkpoints_to_restore == 0 and
            .jobs[$task].max_attempts_per_worker == 2 and .jobs[$task].task_max_attempts == 8 and
            .jobs[$task].launch.nonce == $nonce and .jobs[$task].launch.status == "armed" and .jobs[$task].launch.expected_manifest_revision == $rev
          ' config/passages/COL-01-015-023.json
          grep -Fq '[rn]' docs/current/FLT_footnote_architecture_process_addendum_v2.0.md
          grep -Fq '[tn]' docs/current/FLT_footnote_architecture_process_addendum_v2.0.md
          grep -Fq '[dl]' docs/current/FLT_footnote_architecture_process_addendum_v2.0.md
          grep -Fq 'Col.1.14' logs/FLT_librarian_backlog.md
          npm --prefix phase4-harness ci
          npm --prefix phase4-harness test
          node --input-type=module -e "import fs from 'node:fs'; import {assertPassageSenseResolution} from './phase4-harness/src/sense-resolution-core.js'; const p=JSON.parse(fs.readFileSync('docs/architecture/phase-4/COL-01-015-023_blind-source-v2.2.json','utf8')); assertPassageSenseResolution(p); if(p.units[0].unit_id!=='COL-01-015-023'||p.units[0].verses.length!==9) process.exit(2);"

  claim_running:
    if: >-
      github.event_name == 'push' &&
      !startsWith(github.event.head_commit.message, 'Record Colossians 1:15-23 running state') &&
      !startsWith(github.event.head_commit.message, 'Record Colossians 1:15-23 completion') &&
      !startsWith(github.event.head_commit.message, 'Record Colossians 1:15-23 halt')
    name: Claim next-unit handoff and one-shot blind launch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      target_sha: ${{ steps.claim.outputs.target_sha }}
      run_id: ${{ steps.claim.outputs.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: phase4-harness/package-lock.json
      - name: Credential-free final handoff gate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          jq -e '.manifest_revision == 22 and .state.status == "completed" and .editorial_decisions.final_text_status == "ACCEPTED"' config/passages/COL-01-001-014.json
          jq -e --arg task "$TASK_ID" --arg auth "$AUTHORIZATION_ID" --arg nonce "$LAUNCH_NONCE" --argjson rev "$EXPECTED_MANIFEST_REVISION" '.manifest_revision==$rev and .state.status=="ready" and .state.active_job_id==null and .jobs[$task].status=="authorized_ready" and .jobs[$task].authorization_id==$auth and .jobs[$task].provider_attempts_used==0 and .jobs[$task].checkpoints_to_restore==0 and .jobs[$task].launch.nonce==$nonce and .jobs[$task].launch.status=="armed" and .jobs[$task].launch.consumed_run_id==null' config/passages/COL-01-015-023.json
          grep -Fq 'current_unit_id: "COL-01-001-014"' config/engine_manifest.yaml
          npm --prefix phase4-harness ci
          npm --prefix phase4-harness test
          node --input-type=module -e "import fs from 'node:fs'; import {assertPassageSenseResolution} from './phase4-harness/src/sense-resolution-core.js'; assertPassageSenseResolution(JSON.parse(fs.readFileSync('docs/architecture/phase-4/COL-01-015-023_blind-source-v2.2.json','utf8')));"
      - name: Atomically move engine pointer and consume launch nonce
        id: claim
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('config/engine_manifest.yaml')
          s=p.read_text()
          s=s.replace('last_updated: "2026-08-10"','last_updated: "2026-08-11"',1)
          s=s.replace('  current_unit_id: "COL-01-001-014"\n  current_passage_manifest: "config/passages/COL-01-001-014.json"','  current_unit_id: "COL-01-015-023"\n  current_passage_manifest: "config/passages/COL-01-015-023.json"',1)
          add='  - "docs/current/FLT_footnote_architecture_process_addendum_v2.0.md"\n'
          anchor='  - "docs/current/FLT_style_guide_v2.0.md"\n'
          if add.strip() not in s:
              s=s.replace(anchor,anchor+add,1)
          s=s.replace('    passage_manifest: "config/passages/COL-01-001-014.json"','    passage_manifest: "config/passages/COL-01-015-023.json"',1)
          s=s.replace('    blind_source: "docs/architecture/phase-4/COL-01-001-014_blind-source-v2.2.json"','    blind_source: "docs/architecture/phase-4/COL-01-015-023_blind-source-v2.2.json"',1)
          marker='accepted_units:\n'
          entry='  - passage: "Colossians 1:1-14"\n    status: "ACCEPTED after final Engine 2.2 audit with documented Human Editor note-layer override; [tn]/[rn]/[dl] backlog routed under the Footnote Architecture Process Addendum"\n    draft_run_id: 31458938652\n    smoothing_run_id: 31522547468\n    audit_run_id: 31526453016\n    audit_artifact: "FLT-COL-01-20260811-3-final-audit"\n'
          if '  - passage: "Colossians 1:1-14"' not in s:
              s=s.replace(marker,marker+entry,1)
          p.write_text(s)
          PY
          jq --arg task "$TASK_ID" --arg run "$GITHUB_RUN_ID" --arg nonce "$LAUNCH_NONCE" '
            .manifest_revision=2 |
            .authority.state_source="this_file_on_default_branch" |
            .state.status="running" |
            .state.phase="blind_draft_running" |
            .state.active_job_id=$task |
            .state.active_run_id=$run |
            .state.github_workflow_dispatch_allowed=false |
            .state.next_permitted_action="await verified Colossians 1:15-23 blind A/B/C completion or exact cancel" |
            .allowed_actions=["flt status COL-01-015-023","flt cancel COL-01-015-023 --job COL-01-015-023-BLIND-DRAFT-01 --expected-revision 2","read_only_repository_inspection"] |
            .jobs[$task].status="running" |
            .jobs[$task].dispatch_confirmed=true |
            .jobs[$task].remote_run_id=$run |
            .jobs[$task].retry_allowed=false |
            .jobs[$task].launch.status="consumed" |
            .jobs[$task].launch.consumed_run_id=$run |
            .jobs[$task].launch.consumed_nonce=$nonce
          ' config/passages/COL-01-015-023.json > /tmp/manifest.json
          mv /tmp/manifest.json config/passages/COL-01-015-023.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- config/engine_manifest.yaml config/passages/COL-01-015-023.json
          git commit -m "Record Colossians 1:15-23 running state ${GITHUB_RUN_ID}"
          git push origin HEAD:main
          echo "target_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "run_id=$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"

  draft:
    needs: claim_running
    if: needs.claim_running.result == 'success'
    name: Three blind Engine 2.2 candidates for Colossians 1:15-23
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.claim_running.outputs.target_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: phase4-harness/package-lock.json
      - name: Install Engine 2.2 harness dependencies
        run: npm --prefix phase4-harness ci
      - name: Create bounded run identity
        id: run
        shell: bash
        run: |
          set -euo pipefail
          run_id="FLT-COL-01-$(date -u +%Y%m%d)-${GITHUB_RUN_NUMBER}"
          node phase4-harness/scripts/prepare-run-config.mjs phase4-harness/config.github-actions.json phase4-harness/.col1-015-023-config.json "$run_id"
          jq --arg task_id "$TASK_ID" '.unit_id="COL-01-015-023" | .source_packet="../docs/architecture/phase-4/COL-01-015-023_blind-source-v2.2.json" | .task_id=$task_id | .max_attempts=2 | .task_max_attempts=8 | .timeout_ms=300000' phase4-harness/.col1-015-023-config.json > /tmp/config.json
          mv /tmp/config.json phase4-harness/.col1-015-023-config.json
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
      - name: Run exactly three blind candidate tasks
        run: node phase4-harness/src/chapter-units.js phase4-harness/.col1-015-023-config.json "phase4-harness/runs/${{ steps.run.outputs.run_id }}" docs/architecture/phase-4/COL-01-015-023_blind-source-v2.2.json
      - name: Upload blind-candidate bundle and attempt ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "${{ steps.run.outputs.run_id || 'FLT-COL-01-015-023-halted' }}"
          path: phase4-harness/runs/
          retention-days: 30

  record_completion:
    needs: [claim_running, draft]
    if: needs.claim_running.result == 'success' && needs.draft.result == 'success'
    name: Record 1:15-23 completion for Human Editor review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Advance durable state to awaiting Human Editor
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          jq -e --arg task "$TASK_ID" --arg run "$GITHUB_RUN_ID" '.manifest_revision==2 and .state.status=="running" and .state.active_job_id==$task and .state.active_run_id==$run' config/passages/COL-01-015-023.json
          jq --arg task "$TASK_ID" --arg run "$GITHUB_RUN_ID" '
            .manifest_revision=3 |
            .state.status="awaiting_human_editor" |
            .state.phase="blind_draft_complete" |
            .state.active_job_id=null |
            .state.active_run_id=$run |
            .state.candidate_generation_allowed=false |
            .state.provider_dispatch_allowed=false |
            .state.github_workflow_dispatch_allowed=false |
            .state.next_permitted_action="retrieve verified blind-candidate artifact and present untouched A/B/C candidates verse by verse" |
            .allowed_actions=["flt status COL-01-015-023","retrieve verified blind-candidate artifact","read_only_repository_inspection"] |
            .jobs[$task].status="awaiting_human_editor" |
            .jobs[$task].remote_run_id=$run |
            .jobs[$task].retry_allowed=false
          ' config/passages/COL-01-015-023.json > /tmp/manifest.json
          mv /tmp/manifest.json config/passages/COL-01-015-023.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- config/passages/COL-01-015-023.json
          git commit -m "Record Colossians 1:15-23 completion ${GITHUB_RUN_ID}"
          git push origin HEAD:main

  record_halt:
    needs: [claim_running, draft]
    if: always() && needs.claim_running.result == 'success' && needs.draft.result != 'success'
    name: Record 1:15-23 halted state
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Advance durable state to blocked
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          jq -e --arg task "$TASK_ID" --arg run "$GITHUB_RUN_ID" '.manifest_revision==2 and .state.status=="running" and .state.active_job_id==$task and .state.active_run_id==$run' config/passages/COL-01-015-023.json
          jq --arg task "$TASK_ID" --arg run "$GITHUB_RUN_ID" '
            .manifest_revision=3 |
            .state.status="blocked" |
            .state.phase="blind_draft_halted" |
            .state.active_job_id=null |
            .state.active_run_id=$run |
            .state.candidate_generation_allowed=false |
            .state.provider_dispatch_allowed=false |
            .state.github_workflow_dispatch_allowed=false |
            .state.next_permitted_action="inspect verified halt evidence; Human Editor unlock required for any retry" |
            .allowed_actions=["flt status COL-01-015-023","read_only_repository_inspection"] |
            .jobs[$task].status="blocked" |
            .jobs[$task].remote_run_id=$run |
            .jobs[$task].retry_allowed=false
          ' config/passages/COL-01-015-023.json > /tmp/manifest.json
          mv /tmp/manifest.json config/passages/COL-01-015-023.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- config/passages/COL-01-015-023.json
          git commit -m "Record Colossians 1:15-23 halt ${GITHUB_RUN_ID}"
          git push origin HEAD:main
