name: FLT Colossians 1:15-23 blind-draft bootstrap

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/phase4-col1-015-023-sense-drafts.yml'
      - 'config/passages/COL-01-001-014.json'
      - 'config/passages/COL-01-015-023.json'
      - 'docs/architecture/phase-4/COL-01-015-023_blind-source-v2.2.json'
      - 'docs/current/FLT_footnote_architecture_process_addendum_v2.0.md'
      - 'logs/FLT_librarian_backlog.md'

permissions: {contents: read}

jobs:
  validate:
    name: Validate accepted handoff and new source gate — zero provider calls
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: phase4-harness/package-lock.json
      - name: Validate governance, acceptance, new manifest, source gate, and harness
        shell: bash
        run: |
          set -euo pipefail
          jq -e '.manifest_revision == 22 and .state.status == "completed" and .editorial_decisions.final_text_status == "ACCEPTED" and .editorial_decisions.audit_override.status == "confirmed"' config/passages/COL-01-001-014.json
          jq -e '.manifest_revision == 1 and .state.status == "ready" and .unit.unit_id == "COL-01-015-023" and .jobs["COL-01-015-023-BLIND-DRAFT-01"].status == "authorized_ready" and .jobs["COL-01-015-023-BLIND-DRAFT-01"].provider_attempts_used == 0 and .jobs["COL-01-015-023-BLIND-DRAFT-01"].launch.status == "armed"' config/passages/COL-01-015-023.json
          grep -Fq '[rn]' docs/current/FLT_footnote_architecture_process_addendum_v2.0.md
          grep -Fq '[tn]' docs/current/FLT_footnote_architecture_process_addendum_v2.0.md
          grep -Fq '[dl]' docs/current/FLT_footnote_architecture_process_addendum_v2.0.md
          grep -Fq 'Col.1.14' logs/FLT_librarian_backlog.md
          npm --prefix phase4-harness ci
          npm --prefix phase4-harness test
          node --input-type=module -e "import fs from 'node:fs'; import {assertPassageSenseResolution} from './phase4-harness/src/sense-resolution-core.js'; const p=JSON.parse(fs.readFileSync('docs/architecture/phase-4/COL-01-015-023_blind-source-v2.2.json','utf8')); assertPassageSenseResolution(p); if(p.units[0].unit_id!=='COL-01-015-023'||p.units[0].verses.length!==9) process.exit(2);"
