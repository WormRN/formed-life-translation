name: FLT Colossians 1:1-14 final exact-candidate audit bootstrap

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/phase4-col1-001-014-final-exact-audit.yml'
      - 'docs/architecture/phase-4/COL-01-001-014_human-final-v2.2.json'
      - 'docs/architecture/phase-4/COL-01-001-014_human-final-seal-v2.2.json'
      - 'config/passages/COL-01-001-014.json'

permissions: {contents: read}

jobs:
  validate:
    name: Bootstrap final audit validation only — zero provider calls
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: phase4-harness/package-lock.json
      - name: Validate final candidate, seal, manifest and Engine 2.2 harness
        shell: bash
        run: |
          set -euo pipefail
          jq -e '.manifest_revision == 19 and .state.status == "ready" and .jobs["COL-01-001-014-EXACT-AUDIT-01"].status == "authorized_ready"' config/passages/COL-01-001-014.json
          jq -e '.candidate_id == "COL-01-001-014-HUMAN-FINAL-V2.2" and (.verse_renderings|length)==14 and .editorial_requirements[0].type == "study_footnote_required" and .precedents[0].issue == "scope_of_meta_charas"' docs/architecture/phase-4/COL-01-001-014_human-final-v2.2.json
          jq -e '.human_approved == true and .reading_text_sha256 == "d8add1a09f853d0b069b95faf35cf036751d67953b4b5edc22ec2443ddc34cc8"' docs/architecture/phase-4/COL-01-001-014_human-final-seal-v2.2.json
          npm --prefix phase4-harness ci
          npm --prefix phase4-harness test
