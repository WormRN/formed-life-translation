name: FLT Engine 2.2 audit-harness validation
run-name: Validate exact-text audit harness without provider calls

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/phase4-php3-001-011-human-smoothing.yml'
      - 'phase4-harness/src/human-candidate-audit.js'
      - 'phase4-harness/src/human-candidate-seal.js'
      - 'phase4-harness/src/run-integrity.js'
      - 'phase4-harness/schemas/human-candidate-audit.schema.json'
      - 'phase4-harness/test/human-candidate-audit.test.js'
      - 'phase4-harness/test/run-integrity.test.js'

permissions: {contents: read}
concurrency: {group: flt-engine-2-2-audit-harness-validation, cancel-in-progress: true}

jobs:
  validate:
    name: Test audit harness with zero provider calls
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm, cache-dependency-path: phase4-harness/package-lock.json}
      - name: Install and test Engine 2.2
        working-directory: phase4-harness
        run: npm ci && npm test
