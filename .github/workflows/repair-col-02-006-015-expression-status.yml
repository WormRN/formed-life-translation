name: Repair COL-02-006-015 expression statuses and arm draft 05

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-col-02-006-015-expression-status.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Normalize Passage-Sense expression contract, record zero-provider failure, arm fresh job, and self-delete
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          source_path = Path('docs/architecture/phase-4/COL-02-006-015_approved_blind-source-v2.2.json')
          packet = json.loads(source_path.read_text())
          alternatives = {
            'COL2-008-STOICHEIA',
            'COL2-009-SOMATIKOS',
            'COL2-012-FAITH-GENITIVE',
            'COL2-013-015-SUBJECT',
            'COL2-014-CHEIROGRAPHON-DOGMASIN',
            'COL2-015-TRIUMPH'
          }
          for e in packet['passage_sense_resolution']['expressions']:
              sid = e['sense_id']
              if sid in alternatives:
                  e['status'] = 'alternatives_retained'
                  e['human_decision_required'] = True
                  if not e.get('viable_alternatives'):
                      raise SystemExit(f'{sid} must retain viable alternatives')
              else:
                  e['status'] = 'resolved'
                  e['human_decision_required'] = False
              e['audit_text_and_note_together'] = bool(e.get('reader_note_required') is True)

              if e['status'] not in ('resolved','alternatives_retained'):
                  raise SystemExit(f'invalid normalized status {sid}')
              if e['status']=='alternatives_retained' and (not e.get('viable_alternatives') or e.get('human_decision_required') is not True):
                  raise SystemExit(f'invalid alternatives-retained contract {sid}')
              if e['status']=='resolved' and e.get('human_decision_required') is True:
                  raise SystemExit(f'invalid resolved contract {sid}')
              if e.get('audit_text_and_note_together') is True and e.get('reader_note_required') is not True:
                  raise SystemExit(f'invalid note audit contract {sid}')

          refs = {v['reference'] for u in packet['units'] for v in u['verses']}
          prop_refs = {r for p in packet['passage_sense_resolution']['proposition_map'] for r in p.get('references',[])}
          if prop_refs != refs:
              raise SystemExit(f'proposition refs mismatch expected={sorted(refs)} actual={sorted(prop_refs)}')
          source_path.write_text(json.dumps(packet, ensure_ascii=False, indent=2) + '\n')

          manifest_path = Path('config/passages/COL-02-006-015.json')
          m = json.loads(manifest_path.read_text())
          if m.get('manifest_revision') != 5:
              raise SystemExit(f"expected manifest revision 5, found {m.get('manifest_revision')}")
          j4 = m['jobs']['COL-02-006-015-BLIND-DRAFT-04']
          j4['status'] = 'blocked_zero_provider_preflight_expression_status_schema_failure'
          j4['dispatch_allowed'] = False
          j4['provider_attempts_used'] = 0
          j4['remote_run_id'] = '31776593648'
          j4['failure'] = 'Passage-Sense expression statuses used descriptive values outside Engine 2.2 resolved/alternatives_retained contract; nonce not consumed and no provider accessed'
          j4['retry_allowed'] = False

          m['manifest_revision'] = 6
          m['state']['phase'] = 'passage_sense_complete_blind_drafting_authorized_recovery_after_zero_provider_expression_status_schema_failure'
          m['state']['active_job_id'] = None
          m['state']['active_run_id'] = None
          m['state']['next_permitted_action'] = 'automatic manifest-push dispatcher may launch exactly COL-02-006-015-BLIND-DRAFT-05'
          m['allowed_actions'] = ['flt status COL-02-006-015','automatic dispatch of COL-02-006-015-BLIND-DRAFT-05 only','read_only_repository_inspection']
          m['jobs']['COL-02-006-015-BLIND-DRAFT-05'] = {
            'idempotency_key':'flt:2.2:COL-02-006-015:blind-draft:05',
            'job_type':'blind_candidate_passage_sense_drafting',
            'status':'authorized_ready',
            'authorization_id':'HE-COL-02-006-015-BLIND-DRAFT-EXPRESSION-SCHEMA-RECOVERY-20260814',
            'authorized_by':'human_editor',
            'authorization_scope':'Deterministic zero-provider recovery after Passage-Sense expression-status schema rejection. Generate exactly three blind common-goal candidates from the unchanged Human Editor-approved source-side rulings. Comparison translations remain excluded until post-draft Decision-Brief advisory checking.',
            'dispatch_allowed':True,
            'workflow':'.github/workflows/phase4-sense-drafts.yml',
            'max_attempts_per_worker':2,
            'task_max_attempts':8,
            'provider_attempts_used':0,
            'provider_attempts_remaining':8,
            'candidate_a_attempts_used':0,
            'candidate_b_attempts_used':0,
            'candidate_c_attempts_used':0,
            'checkpoints_to_restore':0,
            'dispatch_confirmed':False,
            'retry_allowed':False,
            'launch':{
              'mode':'automatic_manifest_push_dispatch',
              'nonce':'HE-COL-02-006-015-BLIND-DRAFT-20260814-05',
              'status':'armed',
              'armed_by':'human_editor',
              'authorization_id':'HE-COL-02-006-015-BLIND-DRAFT-EXPRESSION-SCHEMA-RECOVERY-20260814',
              'expected_manifest_revision':6,
              'consumed_run_id':None
            }
          }
          m['editorial_decisions']['candidate_status'] = 'blind_drafting_authorized_expression_schema_recovery_not_yet_run'
          manifest_path.write_text(json.dumps(m, ensure_ascii=False, indent=2) + '\n')
          PY
          git rm .github/workflows/repair-col-02-006-015-expression-status.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/architecture/phase-4/COL-02-006-015_approved_blind-source-v2.2.json config/passages/COL-02-006-015.json
          git commit -m 'Normalize Colossians 2:6-15 sense statuses and arm blind draft 05'
          git push origin HEAD:main
