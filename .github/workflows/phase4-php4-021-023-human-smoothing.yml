name: FLT Philippians 4:21-23 accepted exact-text audit (manual only)
run-name: Philippians 4:21-23 exact reading-text and reader-note constitutional audit

on:
  workflow_dispatch:

permissions: {contents: read}
concurrency: {group: flt-php4-021-023-exact-audit, cancel-in-progress: true}

jobs:
  validate:
    if: github.event_name == 'pull_request'
    name: Validate exact-text audit gate with zero provider calls
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm, cache-dependency-path: phase4-harness/package-lock.json}
      - name: Install and test Engine 2.2
        working-directory: phase4-harness
        run: npm ci && npm test

  audit:
    if: github.event_name != 'pull_request'
    name: Exact reading-text and reader-note constitutional audit
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm, cache-dependency-path: phase4-harness/package-lock.json}
      - name: Install and test Engine 2.2
        working-directory: phase4-harness
        run: npm ci && npm test
      - name: Create audit identity and source packet
        id: run
        shell: bash
        run: |
          run_id="FLT-PHP-04-$(date -u +%Y%m%d)-${GITHUB_RUN_NUMBER}"
          node phase4-harness/scripts/prepare-run-config.mjs phase4-harness/config.github-actions.json phase4-harness/.php4-021-023-audit-config.json "$run_id"
          jq '.unit_id="PHP-04-021-023-EXACT-AUDIT" | .source_packet=".php4-021-023-audit-source.json"' phase4-harness/.php4-021-023-audit-config.json > phase4-harness/.php4-021-023-audit-config.tmp
          mv phase4-harness/.php4-021-023-audit-config.tmp phase4-harness/.php4-021-023-audit-config.json
          jq -n \
            --slurpfile brief docs/architecture/phase-4/PHP-04-021-023_blind-source-v2.2.json \
            --slurpfile parsed data/source/sblgnt_parsed.json \
            '$brief[0] as $b | $parsed[0] as $p | {
              source_data: {
                edition: "SBLGNT",
                verses: [$b.units[0].verses[] | . as $v | {
                  reference: $v.reference,
                  greek: $v.greek,
                  tokens: $p[$v.reference]
                }]
              },
              governing_rules: $b.governing_rules,
              matrix_entries: ($b.matrix_alerts + $b.passage_sense_resolution.expressions)
            }' > phase4-harness/.php4-021-023-audit-source.json
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
      - name: Restore validated worker checkpoints
        uses: actions/cache/restore@v4
        with:
          path: phase4-harness/runs/${{ steps.run.outputs.run_id }}/checkpoints
          key: flt-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            flt-${{ github.run_id }}-
      - name: Run exact-text constitutional audit
        run: node phase4-harness/src/human-candidate-audit.js phase4-harness/.php4-021-023-audit-config.json "phase4-harness/runs/${{ steps.run.outputs.run_id }}" docs/architecture/phase-4/PHP-04-021-023_human-editor-synthesis-v2.2.json docs/architecture/phase-4/PHP-04-021-023_human-editor-synthesis-v2.2.seal.json
      - name: Save validated worker checkpoints
        if: always()
        uses: actions/cache/save@v4
        with:
          path: phase4-harness/runs/${{ steps.run.outputs.run_id }}/checkpoints
          key: flt-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload exact-text audit bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "${{ steps.run.outputs.run_id || 'FLT-PHP-04-021-023-AUDIT-blocked' }}-audit"
          path: phase4-harness/runs/
          retention-days: 30
