name: Inspect Colossians 2:1-5 smoothing evidence
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-col2-smooth2.yml'
permissions:
  actions: read
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Download smoothing artifact
        uses: actions/download-artifact@v4
        with:
          name: FLT-COL-02-001-005-20260814-2-oral-smoothing
          path: artifact
          github-token: ${{ github.token }}
          repository: WormRN/formed-life-translation
          run-id: 31765288528
      - name: Print Human Decision Brief
        shell: bash
        run: |
          set -euo pipefail
          file="$(find artifact -type f -name 'oral-smoothing-decision-brief.md' | head -1)"
          test -n "$file"
          echo '===== DECISION BRIEF ====='
          cat "$file"
      - name: Print listener diagnoses and source-aware proposals
        shell: bash
        run: |
          set -euo pipefail
          echo '===== LISTENER DIAGNOSES ====='
          find artifact -type f -path '*/outputs/listener-diagnoses/*.json' -print0 | sort -z | xargs -0 -I{} sh -c 'echo "--- {} ---"; cat "{}"'
          echo '===== SOURCE-AWARE PROPOSALS ====='
          find artifact -type f -path '*/outputs/smoothing-proposals/*.json' -print0 | sort -z | xargs -0 -I{} sh -c 'echo "--- {} ---"; cat "{}"'
