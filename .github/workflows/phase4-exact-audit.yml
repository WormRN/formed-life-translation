name: FLT Engine 2.2 parameterized exact audit
run-name: "${{ inputs.unit_id }} exact audit — ${{ inputs.task_id }}"

on:
  workflow_dispatch:
    inputs:
      unit_id:
        description: Passage unit id, e.g. COL-02-001-005
        required: true
        type: string
      task_id:
        description: Authorized manifest job id
        required: true
        type: string
      authorization_id:
        description: Human Editor authorization id
        required: true
        type: string
      expected_manifest_revision:
        description: Manifest revision that must be armed for this launch
        required: true
        type: number
      passage_manifest_path:
        description: Authoritative passage manifest path
        required: true
        type: string
      blind_source_path:
        description: Passage-Sense blind source packet path
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: "flt-${{ inputs.unit_id }}-exact-audit"
  cancel-in-progress: false

env:
  UNIT_ID: ${{ inputs.unit_id }}
  TASK_ID: ${{ inputs.task_id }}
  AUTHORIZATION_ID: ${{ inputs.authorization_id }}
  EXPECTED_MANIFEST_REVISION: ${{ inputs.expected_manifest_revision }}
  PASSAGE_MANIFEST_PATH: ${{ inputs.passage_manifest_path }}
  BLIND_SOURCE_PATH: ${{ inputs.blind_source_path }}
  CANDIDATE_FILE: docs/architecture/phase-4/${{ inputs.unit_id }}_human-final-v2.2.json
  SEAL_FILE: docs/architecture/phase-4/${{ inputs.unit_id }}_human-final-seal-v2.2.json

jobs:
  claim_running:
    name: Credential-free claim of armed exact-audit launch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      target_sha: ${{ steps.claim.outputs.target_sha }}
      running_revision: ${{ steps.claim.outputs.running_revision }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: phase4-harness/package-lock.json
      - name: Credential-free authorization, sealed package, source, and circuit-breaker preflight
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          case "$PASSAGE_MANIFEST_PATH" in config/passages/*.json) ;; *) echo "invalid passage_manifest_path" >&2; exit 2;; esac
          case "$BLIND_SOURCE_PATH" in docs/architecture/phase-4/*_blind-source-v2.2.json) ;; *) echo "invalid blind_source_path" >&2; exit 2;; esac
          test -f "$PASSAGE_MANIFEST_PATH"
          test -f "$BLIND_SOURCE_PATH"
          test -f "$CANDIDATE_FILE"
          test -f "$SEAL_FILE"
          nonce="$(jq -er --arg task "$TASK_ID" '.jobs[$task].launch.nonce | select(type=="string" and length>0)' "$PASSAGE_MANIFEST_PATH")"
          jq -e --arg unit "$UNIT_ID" --arg task "$TASK_ID" --arg auth "$AUTHORIZATION_ID" --arg nonce "$nonce" --argjson rev "$EXPECTED_MANIFEST_REVISION" '
            .manifest_revision==$rev and
            .unit.unit_id==$unit and .unit.engine_version=="2.2" and
            .state.status=="ready" and .state.active_job_id==null and
            .state.provider_dispatch_allowed==true and .state.github_workflow_dispatch_allowed==true and
            .jobs[$task].status=="authorized_ready" and
            (.jobs[$task].job_type | endswith("semantic_floor_exact_candidate_audit")) and
            .jobs[$task].authorization_id==$auth and .jobs[$task].dispatch_allowed==true and
            .jobs[$task].provider_attempts_used==0 and .jobs[$task].checkpoints_to_restore==0 and
            .jobs[$task].max_attempts_per_worker==2 and .jobs[$task].task_max_attempts==8 and
            .jobs[$task].launch.nonce==$nonce and .jobs[$task].launch.status=="armed" and
            .jobs[$task].launch.expected_manifest_revision==$rev and
            .jobs[$task].launch.consumed_run_id==null and
            ((.jobs[$task].launch.authorization_id // $auth)==$auth)
          ' "$PASSAGE_MANIFEST_PATH"
          jq -e --arg unit "$UNIT_ID" '
            .unit_id==$unit and .engine_version=="2.2" and
            (.human_editor_selection.exact_wording_preserved==true) and
            (.verse_renderings|type=="array" and length>0)
          ' "$CANDIDATE_FILE"
          jq -e --arg unit "$UNIT_ID" '
            .passage_sense_resolution.status=="complete_for_blind_drafting" and
            (.units|length)==1 and .units[0].unit_id==$unit
          ' "$BLIND_SOURCE_PATH"
          npm --prefix phase4-harness ci
          npm --prefix phase4-harness test
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {assertHumanCandidateSeal} from './phase4-harness/src/human-candidate-seal.js';
          const candidate=JSON.parse(fs.readFileSync(process.env.CANDIDATE_FILE,'utf8'));
          const seal=JSON.parse(fs.readFileSync(process.env.SEAL_FILE,'utf8'));
          assertHumanCandidateSeal(candidate,seal);
          NODE
      - name: Consume nonce and record durable exact-audit running state before credentials
        id: claim
        shell: bash
        run: |
          set -euo pipefail
          nonce="$(jq -r --arg task "$TASK_ID" '.jobs[$task].launch.nonce' "$PASSAGE_MANIFEST_PATH")"
          running_revision=$((EXPECTED_MANIFEST_REVISION + 1))
          jq --arg unit "$UNIT_ID" --arg task "$TASK_ID" --arg run "$GITHUB_RUN_ID" --arg nonce "$nonce" --argjson next "$running_revision" '
            .manifest_revision=$next |
            .state.status="running" |
            .state.phase="final_exact_audit_running" |
            .state.active_job_id=$task |
            .state.active_run_id=$run |
            .state.provider_dispatch_allowed=true |
            .state.github_workflow_dispatch_allowed=false |
            .state.next_permitted_action="await verified final exact-audit completion or exact cancel" |
            .allowed_actions=[("flt status "+$unit),("flt cancel "+$unit+" --job "+$task+" --expected-revision "+($next|tostring)),"read_only_repository_inspection"] |
            .jobs[$task].status="running" |
            .jobs[$task].dispatch_confirmed=true |
            .jobs[$task].remote_run_id=$run |
            .jobs[$task].retry_allowed=false |
            .jobs[$task].launch.status="consumed" |
            .jobs[$task].launch.consumed_run_id=$run |
            .jobs[$task].launch.consumed_nonce=$nonce
          ' "$PASSAGE_MANIFEST_PATH" > /tmp/manifest.json
          mv /tmp/manifest.json "$PASSAGE_MANIFEST_PATH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$PASSAGE_MANIFEST_PATH"
          git commit -m "Record ${UNIT_ID} exact-audit running state ${GITHUB_RUN_ID}"
          git push origin HEAD:main
          echo "target_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "running_revision=$running_revision" >> "$GITHUB_OUTPUT"

  audit:
    needs: claim_running
    if: needs.claim_running.result == 'success'
    name: English reconstruction and Greek semantic-floor exact audit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      semantic_pass: ${{ steps.result.outputs.semantic_pass }}
      eligible_count: ${{ steps.result.outputs.eligible_count }}
      attempts_used: ${{ steps.result.outputs.attempts_used }}
      engine_run_id: ${{ steps.identity.outputs.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.claim_running.outputs.target_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: phase4-harness/package-lock.json
      - name: Install and test Engine 2.2
        run: npm --prefix phase4-harness ci && npm --prefix phase4-harness test
      - name: Create bounded exact-audit identity and source packet
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          run_id="FLT-${UNIT_ID}-$(date -u +%Y%m%d)-${GITHUB_RUN_NUMBER}"
          node phase4-harness/scripts/prepare-run-config.mjs phase4-harness/config.github-actions.json phase4-harness/.parameterized-exact-audit-config.json "$run_id"
          jq --arg unit "$UNIT_ID" --arg task "$TASK_ID" '
            .unit_id=$unit | .task_id=$task | .source_packet=".parameterized-exact-audit-source.json" |
            .max_attempts=2 | .task_max_attempts=8
          ' phase4-harness/.parameterized-exact-audit-config.json > /tmp/config.json
          mv /tmp/config.json phase4-harness/.parameterized-exact-audit-config.json
          jq -n --arg unit "$UNIT_ID" --slurpfile brief "$BLIND_SOURCE_PATH" --slurpfile parsed data/source/sblgnt_parsed.json --slurpfile candidate "$CANDIDATE_FILE" '
            $brief[0] as $b | $parsed[0] as $p | $candidate[0] as $c |
            ($b.units[] | select(.unit_id==$unit)) as $u |
            ($c.human_editor_overrides // []) as $overrides |
            {source_data:{edition:"SBLGNT",verses:[$u.verses[] | . as $v | {reference:$v.reference,greek:$v.greek,tokens:$p[$v.reference]}]},
             governing_rules:($b.governing_rules + [$overrides[] | "Binding Human Editor override for "+.reference+": "+.decision+" Rationale: "+(.rationale // "")]),
             matrix_entries:($b.matrix_alerts + $b.passage_sense_resolution.expressions + [$overrides[] | . + {audit_instruction:"Treat this Human Editor override as binding; do not block solely for the explicitly authorized departure."}])}
          ' > phase4-harness/.parameterized-exact-audit-source.json
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
      - name: Run exact Human Candidate audit
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node phase4-harness/src/human-candidate-audit.js phase4-harness/.parameterized-exact-audit-config.json "phase4-harness/runs/${{ steps.identity.outputs.run_id }}" "$CANDIDATE_FILE" "$SEAL_FILE"
      - name: Summarize semantic result and attempt-ledger reservations
        id: result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          run_id='${{ steps.identity.outputs.run_id }}'
          if test -z "$run_id"; then
            echo "semantic_pass=false" >> "$GITHUB_OUTPUT"
            echo "eligible_count=0" >> "$GITHUB_OUTPUT"
            echo "attempts_used=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          run_dir="phase4-harness/runs/$run_id"
          eligible_count="$(find "$run_dir/outputs/audits" -name '*.json' -type f -print0 2>/dev/null | xargs -0 -r jq -r '.output.overall_eligible' | grep -c '^true$' || true)"
          if [ "$eligible_count" = "3" ]; then semantic_pass=true; else semantic_pass=false; fi
          ledger="$run_dir/manifest/task-attempt-budget.json"
          if [ -f "$ledger" ]; then attempts_used="$(jq '.reservations|length' "$ledger")"; else attempts_used=0; fi
          echo "semantic_pass=$semantic_pass" >> "$GITHUB_OUTPUT"
          echo "eligible_count=$eligible_count" >> "$GITHUB_OUTPUT"
          echo "attempts_used=$attempts_used" >> "$GITHUB_OUTPUT"
      - name: Upload exact-audit bundle and attempt ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "${{ steps.identity.outputs.run_id || inputs.unit_id }}-final-audit"
          path: phase4-harness/runs/
          retention-days: 30

  record_pass:
    needs: [claim_running, audit]
    if: needs.audit.result == 'success' && needs.audit.outputs.semantic_pass == 'true'
    name: Record clean exact audit and Human Editor acceptance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Record terminal ACCEPTED state
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          running_revision='${{ needs.claim_running.outputs.running_revision }}'
          completion_revision=$((running_revision + 1))
          attempts='${{ needs.audit.outputs.attempts_used }}'
          test -n "$attempts" || attempts=0
          engine_run='${{ needs.audit.outputs.engine_run_id }}'
          jq -e --arg task "$TASK_ID" --arg run "$GITHUB_RUN_ID" --argjson rev "$running_revision" '
            .manifest_revision==$rev and .state.status=="running" and .state.active_job_id==$task and .state.active_run_id==$run
          ' "$PASSAGE_MANIFEST_PATH"
          jq --arg unit "$UNIT_ID" --arg task "$TASK_ID" --arg run "$GITHUB_RUN_ID" --arg engine "$engine_run" --arg date "$(date -u +%F)" --argjson rev "$completion_revision" --argjson attempts "$attempts" '
            .manifest_revision=$rev |
            .state.status="completed" |
            .state.phase="human_editor_accepted_after_clean_exact_audit" |
            .state.active_job_id=null |
            .state.active_run_id=$run |
            .state.translation_allowed=false |
            .state.provider_dispatch_allowed=false |
            .state.github_workflow_dispatch_allowed=false |
            .state.translation_artifact_mutation_allowed=false |
            .state.next_permitted_action="none for this terminal unit; initialize any next unit only under Human Editor authorization" |
            .allowed_actions=[("flt status "+$unit),"read_only_repository_inspection"] |
            .jobs[$task].status="completed_human_editor_acceptance_recorded" |
            .jobs[$task].provider_attempts_used=$attempts |
            .jobs[$task].provider_attempts_remaining=(8-$attempts) |
            .jobs[$task].auditor_total=3 |
            .jobs[$task].eligible_count=3 |
            .jobs[$task].blocking_defects=0 |
            .jobs[$task].semantic_pass=true |
            .jobs[$task].retry_allowed=false |
            .editorial_decisions.acceptance_status="ACCEPTED" |
            .editorial_decisions.accepted_by="human_editor" |
            .editorial_decisions.accepted_date=$date |
            .editorial_decisions.exact_audit_result={github_run_id:($run|tonumber),engine_run_id:$engine,eligible_count:3,blocking_defects:0,semantic_pass:true,attempts_used:$attempts}
          ' "$PASSAGE_MANIFEST_PATH" > /tmp/manifest.json
          mv /tmp/manifest.json "$PASSAGE_MANIFEST_PATH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$PASSAGE_MANIFEST_PATH"
          git commit -m "Accept ${UNIT_ID} after clean exact audit ${GITHUB_RUN_ID}"
          git push origin HEAD:main

  record_review:
    needs: [claim_running, audit]
    if: always() && needs.claim_running.result == 'success' && (needs.audit.result != 'success' || needs.audit.outputs.semantic_pass != 'true')
    name: Record exact-audit review or halt state
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Return unit to Human Editor or blocked state
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          running_revision='${{ needs.claim_running.outputs.running_revision }}'
          review_revision=$((running_revision + 1))
          result='${{ needs.audit.result }}'
          pass='${{ needs.audit.outputs.semantic_pass }}'
          eligible='${{ needs.audit.outputs.eligible_count }}'
          attempts='${{ needs.audit.outputs.attempts_used }}'
          test -n "$eligible" || eligible=0
          test -n "$attempts" || attempts=0
          jq -e --arg task "$TASK_ID" --arg run "$GITHUB_RUN_ID" --argjson rev "$running_revision" '
            .manifest_revision==$rev and .state.status=="running" and .state.active_job_id==$task and .state.active_run_id==$run
          ' "$PASSAGE_MANIFEST_PATH"
          jq --arg unit "$UNIT_ID" --arg task "$TASK_ID" --arg run "$GITHUB_RUN_ID" --arg result "$result" --arg pass "$pass" --argjson rev "$review_revision" --argjson eligible "$eligible" --argjson attempts "$attempts" '
            .manifest_revision=$rev |
            .state.status=(if $result=="success" then "awaiting_human_editor" else "blocked" end) |
            .state.phase=(if $result=="success" then "final_exact_audit_has_blocks_pending_human_editor" else "final_exact_audit_halted" end) |
            .state.active_job_id=null |
            .state.active_run_id=$run |
            .state.provider_dispatch_allowed=false |
            .state.github_workflow_dispatch_allowed=false |
            .state.next_permitted_action="inspect verified final exact-audit evidence; Human Editor decision required" |
            .allowed_actions=[("flt status "+$unit),"read_only_repository_inspection"] |
            .jobs[$task].status=(if $result=="success" then "awaiting_human_editor" else "blocked" end) |
            .jobs[$task].provider_attempts_used=$attempts |
            .jobs[$task].provider_attempts_remaining=(8-$attempts) |
            .jobs[$task].auditor_total=3 |
            .jobs[$task].eligible_count=$eligible |
            .jobs[$task].semantic_pass=false |
            .jobs[$task].retry_allowed=false
          ' "$PASSAGE_MANIFEST_PATH" > /tmp/manifest.json
          mv /tmp/manifest.json "$PASSAGE_MANIFEST_PATH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$PASSAGE_MANIFEST_PATH"
          git commit -m "Record ${UNIT_ID} exact-audit review state ${GITHUB_RUN_ID}"
          git push origin HEAD:main
