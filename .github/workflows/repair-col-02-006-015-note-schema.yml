name: Repair COL-02-006-015 note schema and arm draft 04

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-col-02-006-015-note-schema.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Repair source packet flags, record zero-provider failure, arm fresh job, and self-delete
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          source_path = Path('docs/architecture/phase-4/COL-02-006-015_approved_blind-source-v2.2.json')
          packet = json.loads(source_path.read_text())
          for e in packet['passage_sense_resolution']['expressions']:
              e['audit_text_and_note_together'] = bool(e.get('reader_note_required') is True)
          source_path.write_text(json.dumps(packet, ensure_ascii=False, indent=2) + '\n')

          manifest_path = Path('config/passages/COL-02-006-015.json')
          m = json.loads(manifest_path.read_text())
          if m.get('manifest_revision') != 4:
              raise SystemExit(f"expected manifest revision 4, found {m.get('manifest_revision')}")
          j3 = m['jobs']['COL-02-006-015-BLIND-DRAFT-03']
          j3['status'] = 'blocked_zero_provider_preflight_note_schema_failure'
          j3['dispatch_allowed'] = False
          j3['provider_attempts_used'] = 0
          j3['remote_run_id'] = '31776431733'
          j3['failure'] = 'Passage-Sense expression audit_text_and_note_together was true on senses without required notes; nonce not consumed and no provider accessed'
          j3['retry_allowed'] = False
          m['manifest_revision'] = 5
          m['state']['phase'] = 'passage_sense_complete_blind_drafting_authorized_recovery_after_zero_provider_note_schema_failure'
          m['state']['active_job_id'] = None
          m['state']['active_run_id'] = None
          m['state']['next_permitted_action'] = 'automatic manifest-push dispatcher may launch exactly COL-02-006-015-BLIND-DRAFT-04'
          m['allowed_actions'] = ['flt status COL-02-006-015','automatic dispatch of COL-02-006-015-BLIND-DRAFT-04 only','read_only_repository_inspection']
          m['jobs']['COL-02-006-015-BLIND-DRAFT-04'] = {
            'idempotency_key':'flt:2.2:COL-02-006-015:blind-draft:04',
            'job_type':'blind_candidate_passage_sense_drafting',
            'status':'authorized_ready',
            'authorization_id':'HE-COL-02-006-015-BLIND-DRAFT-NOTE-SCHEMA-RECOVERY-20260814',
            'authorized_by':'human_editor',
            'authorization_scope':'Deterministic zero-provider recovery after Passage-Sense note-audit schema rejection. Generate exactly three blind common-goal candidates from the unchanged Human Editor-approved source-side rulings. Comparison translations remain excluded until post-draft Decision-Brief advisory checking.',
            'dispatch_allowed':True,
            'workflow':'.github/workflows/phase4-sense-drafts.yml',
            'max_attempts_per_worker':2,
            'task_max_attempts':8,
            'provider_attempts_used':0,
            'provider_attempts_remaining':8,
            'candidate_a_attempts_used':0,
            'candidate_b_attempts_used':0,
            'candidate_c_attempts_used':0,
            'checkpoints_to_restore':0,
            'dispatch_confirmed':False,
            'retry_allowed':False,
            'launch':{
              'mode':'automatic_manifest_push_dispatch',
              'nonce':'HE-COL-02-006-015-BLIND-DRAFT-20260814-04',
              'status':'armed',
              'armed_by':'human_editor',
              'authorization_id':'HE-COL-02-006-015-BLIND-DRAFT-NOTE-SCHEMA-RECOVERY-20260814',
              'expected_manifest_revision':5,
              'consumed_run_id':None
            }
          }
          m['editorial_decisions']['candidate_status'] = 'blind_drafting_authorized_note_schema_recovery_not_yet_run'
          manifest_path.write_text(json.dumps(m, ensure_ascii=False, indent=2) + '\n')
          PY
          git rm .github/workflows/repair-col-02-006-015-note-schema.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/architecture/phase-4/COL-02-006-015_approved_blind-source-v2.2.json config/passages/COL-02-006-015.json
          git commit -m 'Repair Colossians 2:6-15 note schema and arm blind draft 04'
          git push origin HEAD:main
