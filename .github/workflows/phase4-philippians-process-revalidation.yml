name: FLT Philippians common-goal process revalidation
run-name: Philippians 1:1-30 and 2:1-24 process revalidation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase4-philippians-process-revalidation.yml'
      - 'phase4-harness/src/process-revalidation-batch.js'
      - 'docs/architecture/phase-4/PHP-REVALIDATION-001-024_blind-source.json'
  workflow_dispatch:

permissions: {contents: write}
concurrency: {group: flt-philippians-process-revalidation, cancel-in-progress: false}

jobs:
  draft:
    name: 27 authenticated common-goal blind drafts
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: phase4-harness/package-lock.json
      - name: Install and test
        working-directory: phase4-harness
        run: npm ci && npm test
      - name: Create run identity
        id: run
        shell: bash
        run: |
          run_id="FLT-PHP-REVALIDATION-$(date -u +%Y%m%d)-${GITHUB_RUN_NUMBER}"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
      - name: Run common-goal process revalidation
        id: draft
        run: |
          node phase4-harness/src/process-revalidation-batch.js \
            phase4-harness/config.github-actions.json \
            docs/architecture/phase-4/PHP-REVALIDATION-001-024_blind-source.json \
            "phase4-harness/runs/${{ steps.run.outputs.run_id }}" \
            "${{ steps.run.outputs.run_id }}"
      - name: Upload recovery bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "${{ steps.run.outputs.run_id || 'FLT-PHP-REVALIDATION-BLOCKED' }}"
          path: phase4-harness/runs/
          retention-days: 30
      - name: Publish machine-readable recovery receipt
        if: always()
        env:
          DRAFT_STEP_OUTCOME: ${{ steps.draft.outcome }}
          ENGINE_RUN_ID: ${{ steps.run.outputs.run_id }}
        shell: bash
        run: |
          mkdir -p config
          generated_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          run_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          provenance="phase4-harness/runs/${ENGINE_RUN_ID}/manifest/process-revalidation-provenance.json"
          receipt_status="completed"
          common_goal_verified=false
          aggregate_prompt_sha256=""
          candidate_count=0
          unit_ids='[]'
          prompt_hashes='{}'
          if [ "$DRAFT_STEP_OUTCOME" != "success" ]; then receipt_status="workflow_failed"; fi
          if [ -f "$provenance" ]; then
            common_goal_verified=$(jq -r '.common_goal_verified' "$provenance")
            aggregate_prompt_sha256=$(jq -r '.aggregate_prompt_sha256' "$provenance")
            candidate_count=$(jq -r '.candidate_count' "$provenance")
            unit_ids=$(jq -c '[.units[].unit_id]' "$provenance")
            prompt_hashes=$(jq -c '.units | map({key:.unit_id,value:.common_prompt_sha256}) | from_entries' "$provenance")
          fi
          if [ "$common_goal_verified" != "true" ]; then receipt_status="workflow_failed"; fi
          jq -n \
            --argjson schema_version 1 \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg workflow_path ".github/workflows/phase4-philippians-process-revalidation.yml" \
            --arg batch_id "PHP-REVALIDATION-001-024" \
            --arg passage "Philippians 1:1-30 and 2:1-24" \
            --arg engine_run_id "$ENGINE_RUN_ID" \
            --argjson github_run_id "$GITHUB_RUN_ID" \
            --arg run_url "$run_url" \
            --arg artifact_name "$ENGINE_RUN_ID" \
            --arg head_sha "$GITHUB_SHA" \
            --arg generated_at "$generated_at" \
            --arg job_outcome "$DRAFT_STEP_OUTCOME" \
            --arg receipt_status "$receipt_status" \
            --argjson common_goal_verified "$common_goal_verified" \
            --arg aggregate_prompt_sha256 "$aggregate_prompt_sha256" \
            --argjson candidate_count "$candidate_count" \
            --argjson unit_ids "$unit_ids" \
            --argjson common_prompt_sha256_by_unit "$prompt_hashes" \
            --arg excluded_valid_unit "Philippians 2:25-30" \
            '{schema_version:$schema_version,repository:$repository,workflow_path:$workflow_path,batch_id:$batch_id,passage:$passage,engine_run_id:$engine_run_id,github_run_id:$github_run_id,run_url:$run_url,artifact_name:$artifact_name,head_sha:$head_sha,generated_at:$generated_at,job_outcome:$job_outcome,receipt_status:$receipt_status,common_goal_verified:$common_goal_verified,aggregate_prompt_sha256:$aggregate_prompt_sha256,candidate_count:$candidate_count,unit_ids:$unit_ids,common_prompt_sha256_by_unit:$common_prompt_sha256_by_unit,current_flt_hidden:true,comparison_translations_hidden:true,excluded_valid_unit:$excluded_valid_unit,human_decision_required:true}' > config/latest_draft_run.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/latest_draft_run.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record Philippians process-revalidation receipt"
          git pull --rebase origin main
          git push origin HEAD:main
