name: FLT Phase 4 reader-first refinement

on:
  push:
    branches: [main]
    paths: ['.github/workflows/phase4-reader-refinement.yml']
  workflow_dispatch:
    inputs:
      artifact_id:
        description: Completed ensemble artifact
        required: true
        default: '8433634100'
      parent_run_id:
        description: Completed ensemble run ID
        required: true
        default: 'FLT-PHP-01-20260718-901'

permissions: {contents: read, actions: read}
concurrency: {group: flt-phase-4-reader-refinement, cancel-in-progress: false}

jobs:
  refine:
    name: Reader-first candidates, reader tests, and semantic floor
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm, cache-dependency-path: phase4-harness/package-lock.json}
      - name: Install and test
        working-directory: phase4-harness
        run: npm ci && npm test
      - name: Create run identity
        id: run
        shell: bash
        run: |
          n=$((950 + GITHUB_RUN_NUMBER)); if (( n > 999 )); then exit 1; fi
          run_id="FLT-PHP-01-$(date -u +%Y%m%d)-$(printf '%03d' "$n")"
          node phase4-harness/scripts/prepare-run-config.mjs phase4-harness/config.github-actions.json phase4-harness/.reader-config.json "$run_id"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
      - name: Recover ensemble evidence
        shell: bash
        run: |
          mkdir -p /tmp/p && gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${{ inputs.artifact_id || '8433634100' }}/zip" > /tmp/p.zip
          unzip -q /tmp/p.zip -d /tmp/p
          src=$(find /tmp/p -mindepth 1 -maxdepth 1 -type d | head -1); test -d "$src/outputs/syntheses"
          target="phase4-harness/runs/${{ steps.run.outputs.run_id }}"; mkdir -p "$target/evidence" "$target/manifest"
          cp -R "$src/outputs/syntheses" "$target/evidence/syntheses"
          jq -n --arg run_id '${{ steps.run.outputs.run_id }}' --arg parent '${{ inputs.parent_run_id || 'FLT-PHP-01-20260718-901' }}' --arg artifact '${{ inputs.artifact_id || '8433634100' }}' '{run_id:$run_id,parent_run_id:$parent,parent_artifact_id:$artifact,status:"reader_refinement_initialized"}' > "$target/manifest/recovery.json"
      - name: Run reader-first refinement
        run: node phase4-harness/src/reader-refinement.js phase4-harness/.reader-config.json "phase4-harness/runs/${{ steps.run.outputs.run_id }}"
      - name: Upload refinement bundle
        if: always()
        uses: actions/upload-artifact@v4
        with: {name: "${{ steps.run.outputs.run_id || 'FLT-reader-refinement-blocked' }}", path: phase4-harness/runs/, retention-days: 30}
