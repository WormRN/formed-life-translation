name: FLT Philippians whole-letter review
run-name: Philippians whole-letter oral, source, and Engine 2.2 compatibility review

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/phase4-php-whole-letter-review.yml'
      - 'docs/architecture/phase-4/FLT_Philippians_whole-letter-review-input-v01.json'
      - 'phase4-harness/src/whole-letter-review.js'
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase4-php-whole-letter-review.yml'
      - 'docs/architecture/phase-4/FLT_Philippians_whole-letter-review-input-v01.json'
      - 'phase4-harness/src/whole-letter-review.js'

permissions: {contents: read}
concurrency: {group: flt-php-whole-letter-review, cancel-in-progress: false}

jobs:
  validate:
    if: github.event_name == 'pull_request'
    name: Validate whole-letter review with zero provider calls
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm, cache-dependency-path: phase4-harness/package-lock.json}
      - name: Install and test Engine 2.2
        working-directory: phase4-harness
        run: npm ci && npm test
      - name: Validate review code and immutable input
        shell: bash
        run: |
          node --check phase4-harness/src/whole-letter-review.js
          jq -e '(.verse_renderings|length)==104 and .verse_renderings[0].reference=="Phil.1.1" and .verse_renderings[-1].reference=="Phil.4.23" and .authority.accepted_wording_preserved==true and .authority.reviewers_may_not_change_text==true and .copyright_protocol.status=="DEFERRED_BATCH" and .copyright_protocol.publication_clearance==false' docs/architecture/phase-4/FLT_Philippians_whole-letter-review-input-v01.json

  review:
    if: github.event_name == 'push'
    name: Six-worker whole-letter review
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm, cache-dependency-path: phase4-harness/package-lock.json}
      - name: Install and test Engine 2.2
        working-directory: phase4-harness
        run: npm ci && npm test
      - name: Create review identity and source packet
        id: run
        shell: bash
        run: |
          run_id="FLT-PHP-00-$(date -u +%Y%m%d)-${GITHUB_RUN_NUMBER}"
          node phase4-harness/scripts/prepare-run-config.mjs phase4-harness/config.github-actions.json phase4-harness/.php-whole-letter-review-config.json "$run_id"
          jq '.unit_id="PHP-01-001-THROUGH-04-023-WHOLE-LETTER-REVIEW" | .source_packet=".php-whole-letter-review-source.json" | .timeout_ms=300000' phase4-harness/.php-whole-letter-review-config.json > phase4-harness/.php-whole-letter-review-config.tmp
          mv phase4-harness/.php-whole-letter-review-config.tmp phase4-harness/.php-whole-letter-review-config.json
          jq -n --slurpfile candidate docs/architecture/phase-4/FLT_Philippians_whole-letter-review-input-v01.json --slurpfile parsed data/source/sblgnt_parsed.json '{source_data:{edition:"SBLGNT",verses:[$candidate[0].verse_renderings[] | . as $v | {reference:$v.reference,tokens:$parsed[0][$v.reference]}]},governing_rules:["Review the exact accepted Philippians text as one literary and oral letter.","Respect Human Editor authority and prior explicit overrides; reviewers provide evidence only.","Identify concrete whole-letter seams, terminology inconsistencies, note problems, cumulative over-expansion, or semantic defects; do not retranslate for novelty.","Certify chapters 1-2 for Engine 2.2 compatibility without rerunning blind drafting; reopen only for a substantive defect.","No comparison translation is present. Preserve DEFERRED_BATCH and do not claim copyright clearance."]}' > phase4-harness/.php-whole-letter-review-source.json
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
      - name: Restore validated worker checkpoints
        uses: actions/cache/restore@v4
        with:
          path: phase4-harness/runs/${{ steps.run.outputs.run_id }}/checkpoints
          key: flt-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            flt-${{ github.run_id }}-
      - name: Run whole-letter review
        run: node phase4-harness/src/whole-letter-review.js phase4-harness/.php-whole-letter-review-config.json "phase4-harness/runs/${{ steps.run.outputs.run_id }}" docs/architecture/phase-4/FLT_Philippians_whole-letter-review-input-v01.json
      - name: Save validated worker checkpoints
        if: always()
        uses: actions/cache/save@v4
        with:
          path: phase4-harness/runs/${{ steps.run.outputs.run_id }}/checkpoints
          key: flt-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload whole-letter review bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "${{ steps.run.outputs.run_id || 'FLT-PHP-WHOLE-LETTER-REVIEW-blocked' }}"
          path: phase4-harness/runs/
          retention-days: 30

