name: FLT Phase 4 ensemble review

on:
  workflow_dispatch:
    inputs:
      artifact_id:
        description: Successful critique recovery artifact ID
        required: true
        default: '8433160413'
      parent_run_id:
        description: Immutable critique run ID
        required: true
        default: 'FLT-PHP-01-20260718-501'

permissions:
  contents: read
  actions: read

concurrency:
  group: flt-phase-4-ensemble-review
  cancel-in-progress: false

jobs:
  review:
    name: Focused checks, synthesis, and blind evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: phase4-harness/package-lock.json
      - name: Install and test
        working-directory: phase4-harness
        run: npm ci && npm test
      - name: Create review identity
        id: review
        shell: bash
        run: |
          sequence_number=$((800 + GITHUB_RUN_NUMBER))
          if (( sequence_number > 999 )); then echo "Review run-ID range exhausted" >&2; exit 1; fi
          run_id="FLT-PHP-01-$(date -u +%Y%m%d)-$(printf '%03d' "$sequence_number")"
          node phase4-harness/scripts/prepare-run-config.mjs phase4-harness/config.github-actions.json phase4-harness/.review-config.json "$run_id"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
      - name: Recover validated drafts and critiques
        shell: bash
        run: |
          mkdir -p /tmp/parent-artifact
          gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${{ inputs.artifact_id }}/zip" > /tmp/parent.zip
          unzip -q /tmp/parent.zip -d /tmp/parent-artifact
          source_dir=$(find /tmp/parent-artifact -mindepth 1 -maxdepth 1 -type d | head -n 1)
          test -d "$source_dir/outputs/drafts"
          test -d "$source_dir/outputs/critiques/self"
          test -d "$source_dir/outputs/critiques/cross"
          target="phase4-harness/runs/${{ steps.review.outputs.run_id }}"
          mkdir -p "$target/outputs" "$target/manifest"
          cp -R "$source_dir/outputs/drafts" "$target/outputs/drafts"
          cp -R "$source_dir/outputs/critiques" "$target/outputs/critiques"
          jq -n --arg run_id '${{ steps.review.outputs.run_id }}' --arg parent '${{ inputs.parent_run_id }}' --arg artifact '${{ inputs.artifact_id }}' --arg workflow_run '${{ github.run_id }}' '{run_id:$run_id,parent_run_id:$parent,parent_artifact_id:$artifact,workflow_run:$workflow_run,reused_material:["validated blind drafts","validated self critiques","validated cross critiques"],excluded_material:["benchmark wording","comparison translations","human wording preferences"],status:"ensemble_review_initialized"}' > "$target/manifest/review_recovery.json"
      - name: Run ensemble review
        run: node phase4-harness/src/review.js phase4-harness/.review-config.json "phase4-harness/runs/${{ steps.review.outputs.run_id }}"
      - name: Upload review provenance bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.review.outputs.run_id || 'FLT-ensemble-review-blocked' }}
          path: phase4-harness/runs/
          if-no-files-found: warn
          retention-days: 30
