name: FLT Phase 4 resume ensemble review

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase4-review-recovery.yml'
  workflow_dispatch:
    inputs:
      artifact_id:
        description: Partial ensemble artifact ID
        required: true
        default: '8433591152'
      parent_run_id:
        description: Partial ensemble run ID
        required: true
        default: 'FLT-PHP-01-20260718-803'

permissions:
  contents: read
  actions: read

concurrency:
  group: flt-phase-4-ensemble-recovery
  cancel-in-progress: false

jobs:
  recover:
    name: Reuse completed review stages and recover missing calls
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: phase4-harness/package-lock.json
      - name: Install and test
        working-directory: phase4-harness
        run: npm ci && npm test
      - name: Create recovery identity
        id: review
        shell: bash
        run: |
          sequence_number=$((900 + GITHUB_RUN_NUMBER))
          if (( sequence_number > 999 )); then echo "Review recovery run-ID range exhausted" >&2; exit 1; fi
          run_id="FLT-PHP-01-$(date -u +%Y%m%d)-$(printf '%03d' "$sequence_number")"
          node phase4-harness/scripts/prepare-run-config.mjs phase4-harness/config.github-actions.json phase4-harness/.review-config.json "$run_id"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
      - name: Recover partial ensemble artifact
        shell: bash
        run: |
          mkdir -p /tmp/parent-artifact
          gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${{ inputs.artifact_id || '8433591152' }}/zip" > /tmp/parent.zip
          unzip -q /tmp/parent.zip -d /tmp/parent-artifact
          source_dir=$(find /tmp/parent-artifact -mindepth 1 -maxdepth 1 -type d | head -n 1)
          test -d "$source_dir/outputs/drafts"
          test -d "$source_dir/outputs/focused-checks"
          test -d "$source_dir/outputs/syntheses"
          target="phase4-harness/runs/${{ steps.review.outputs.run_id }}"
          mkdir -p "$target/manifest"
          cp -R "$source_dir/outputs" "$target/outputs"
          if test -d "$source_dir/failures"; then cp -R "$source_dir/failures" "$target/failures"; fi
          cp "$source_dir/manifest/event_log.jsonl" "$target/manifest/event_log.jsonl"
          jq -n --arg run_id '${{ steps.review.outputs.run_id }}' --arg parent '${{ inputs.parent_run_id || 'FLT-PHP-01-20260718-803' }}' --arg artifact '${{ inputs.artifact_id || '8433591152' }}' --arg workflow_run '${{ github.run_id }}' '{run_id:$run_id,parent_run_id:$parent,parent_artifact_id:$artifact,workflow_run:$workflow_run,reused_material:["validated drafts and critiques","three focused checks","three independent syntheses","available blind evaluations"],excluded_material:["benchmark wording","comparison translations","human wording preferences"],status:"ensemble_resume_initialized"}' > "$target/manifest/review_recovery.json"
      - name: Resume ensemble review
        run: node phase4-harness/src/review.js phase4-harness/.review-config.json "phase4-harness/runs/${{ steps.review.outputs.run_id }}" --resume
      - name: Upload recovered review bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.review.outputs.run_id || 'FLT-ensemble-resume-blocked' }}
          path: phase4-harness/runs/
          if-no-files-found: warn
          retention-days: 30
