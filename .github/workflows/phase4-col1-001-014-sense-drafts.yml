name: QUARANTINED — Colossians 1:1-14 blind candidate batch 01
run-name: BLOCKED — quarantined Colossians batch 01

# Historical workflow retained as evidence of PR #48.
# Batch 01 has an unknown terminal outcome and must never be resumed or rerun.
# The job-level false condition guarantees that a manual dispatch cannot allocate
# a runner, expose provider credentials, or make provider calls.

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Historical immutable target SHA; dispatch remains blocked
        required: true
        type: string
      task_id:
        description: Historical quarantined job ID; dispatch remains blocked
        required: true
        default: COL-01-001-014-BLIND-DRAFT-BATCH-01
        type: string

permissions:
  contents: read

jobs:
  quarantined:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - name: Quarantined by passage manifest
        run: |
          echo "COL-01-001-014-BLIND-DRAFT-BATCH-01 is permanently quarantined."
          exit 1
