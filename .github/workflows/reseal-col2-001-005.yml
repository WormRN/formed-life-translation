name: One-shot reseal Colossians 2:1-5 post-smoothing final

on:
  push:
    paths:
      - '.github/workflows/reseal-col2-001-005.yml'

permissions:
  contents: write

jobs:
  reseal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: phase4-harness/package-lock.json
      - run: npm --prefix phase4-harness ci
      - name: Generate final seal and arm exact audit 02
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {createHumanCandidateSeal} from './phase4-harness/src/human-candidate-seal.js';
          import {sha256} from './phase4-harness/src/core.js';
          const candidatePath='docs/architecture/phase-4/COL-02-001-005_human-final-v2.2.json';
          const sealPath='docs/architecture/phase-4/COL-02-001-005_human-final-seal-v2.2.json';
          const manifestPath='config/passages/COL-02-001-005.json';
          const candidate=JSON.parse(fs.readFileSync(candidatePath,'utf8'));
          const seal=createHumanCandidateSeal(candidate,{approvedBy:'human_editor',approvedAt:'2026-08-13T22:46:00-05:00'});
          seal.human_editor_overrides_sha256=sha256(candidate.human_editor_overrides||[]);
          seal.complete_package_sha256=sha256({candidate_material_sha256:seal.candidate_material_sha256,human_editor_overrides_sha256:seal.human_editor_overrides_sha256});
          seal.package_components=['exact reading text Col.2.1-5','COL-02-002-TN-01','COL-02-005-TN-01','binding Human Editor Col.2.1 fighting ruling','Human Editor Col.2.2 plērophoria verbal-assurance decision'];
          fs.writeFileSync(sealPath,JSON.stringify(seal,null,2)+'\n');
          const m=JSON.parse(fs.readFileSync(manifestPath,'utf8'));
          if(m.manifest_revision!==19 || m.state.status!=='awaiting_human_editor') throw new Error('Unexpected manifest state before reseal');
          m.manifest_revision=20;
          m.last_updated='2026-08-13';
          m.state={status:'ready',phase:'post_smoothing_human_editor_final_exact_audit_ready',active_job_id:null,active_run_id:null,translation_allowed:true,candidate_generation_allowed:false,provider_dispatch_allowed:true,github_workflow_dispatch_allowed:true,translation_artifact_mutation_allowed:false,next_permitted_action:'automatic dispatch of authorized terminal exact audit 02'};
          m.allowed_actions=['flt status COL-02-001-005','read_only_repository_inspection'];
          m.forbidden_actions=['rerun successful blind workers','reuse prior smoothing or exact-audit jobs','change the sealed Human Editor final text','omit either transparency note from the terminal audit package','modify terminal Colossians chapter 1 units','reuse a consumed nonce'];
          m.jobs['COL-02-001-005-EXACT-AUDIT-02']={idempotency_key:'flt:2.2:COL-02-001-005:exact-audit:02',job_type:'complete_package_semantic_floor_exact_candidate_audit',status:'authorized_ready',authorization_id:'HE-COL-02-001-005-POST-SMOOTH-TERMINAL-AUDIT-20260813',authorized_by:'human_editor',authorization_scope:'Audit the exact post-smoothing Human Editor final reading text together with both approved transparency notes and binding Human Editor lexical decisions; do not alter Col.1.29; on a clean 3-of-3 zero-block semantic pass record terminal Human Editor acceptance.',dispatch_allowed:true,workflow:'.github/workflows/phase4-exact-audit.yml',max_attempts_per_worker:2,task_max_attempts:8,provider_attempts_used:0,provider_attempts_remaining:8,checkpoints_to_restore:0,dispatch_confirmed:false,retry_allowed:false,launch:{mode:'automatic_manifest_push_dispatch',nonce:'HE-COL-02-001-005-POST-SMOOTH-EXACT-AUDIT-20260813-02',status:'armed',armed_by:'human_editor',authorization_id:'HE-COL-02-001-005-POST-SMOOTH-TERMINAL-AUDIT-20260813',expected_manifest_revision:20,consumed_run_id:null,consumed_nonce:null}};
          m.editorial_decisions.candidate_status='human_editor_final_post_smoothing_complete_package_sealed';
          m.editorial_decisions.human_editor_selection='exact post-smoothing final text supplied by Human Editor 2026-08-13';
          m.editorial_decisions.acceptance_status='PENDING_NEW_TERMINAL_EXACT_AUDIT';
          m.editorial_decisions.terminal_status='resealed_post_smoothing_pending_exact_audit';
          m.editorial_decisions.sealed_candidate_id=candidate.candidate_id;
          m.editorial_decisions.sealed_reading_text_sha256=seal.reading_text_sha256;
          m.editorial_decisions.sealed_reader_notes_sha256=seal.reader_notes_sha256;
          m.editorial_decisions.sealed_candidate_material_sha256=seal.candidate_material_sha256;
          m.editorial_decisions.sealed_human_editor_overrides_sha256=seal.human_editor_overrides_sha256;
          m.editorial_decisions.sealed_complete_package_sha256=seal.complete_package_sha256;
          fs.writeFileSync(manifestPath,JSON.stringify(m,null,2)+'\n');
          NODE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/architecture/phase-4/COL-02-001-005_human-final-seal-v2.2.json config/passages/COL-02-001-005.json
          git commit -m 'Reseal Colossians 2:1-5 after full smoothing adjudication'
          git push origin HEAD:main
