name: FLT Phase 4 Philippians 2:5-11 candidate audit

on:
  push:
    branches: [main]
    paths: ['.github/workflows/phase4-php2-005-011-candidate-audit.yml']
  workflow_dispatch:

permissions: {contents: read}
concurrency: {group: flt-phase-4-php2-005-011-candidate-audit, cancel-in-progress: false}

jobs:
  audit:
    name: Reconstruction and semantic-floor audit for Philippians 2:5-11
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm, cache-dependency-path: phase4-harness/package-lock.json}
      - name: Install and test
        working-directory: phase4-harness
        run: npm ci && npm test
      - name: Create run identity
        id: run
        shell: bash
        run: |
          run_id="FLT-PHP-02-$(date -u +%Y%m%d)-${GITHUB_RUN_NUMBER}"
          node phase4-harness/scripts/prepare-run-config.mjs phase4-harness/config.github-actions.json phase4-harness/.php2-005-011-audit-config.json "$run_id"
          jq '.unit_id="PHP-02-005-011" | .source_packet="../docs/architecture/phase-4/PHP-02-005-011_audit-source.json"' phase4-harness/.php2-005-011-audit-config.json > phase4-harness/.php2-005-011-audit-config.tmp
          mv phase4-harness/.php2-005-011-audit-config.tmp phase4-harness/.php2-005-011-audit-config.json
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
      - name: Audit human-edited candidate
        run: node phase4-harness/src/human-candidate-audit.js phase4-harness/.php2-005-011-audit-config.json "phase4-harness/runs/${{ steps.run.outputs.run_id }}" docs/architecture/phase-4/PHP-02-005-011_human-editor-candidate-v01.json
      - name: Upload candidate audit bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "${{ steps.run.outputs.run_id || 'FLT-PHP-02-005-011-audit-blocked' }}"
          path: phase4-harness/runs/
          retention-days: 30
