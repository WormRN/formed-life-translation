name: Record Philippians 4:10-20 smoothing run
run-name: Locate and record the original Philippians 4:10-20 smoothing run

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/record-php4-010-020-smoothing-run.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/record-php4-010-020-smoothing-run.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  validate:
    if: github.event_name == 'pull_request'
    name: Validate locator with zero provider calls
    runs-on: ubuntu-latest
    steps:
      - run: echo "Locator validation only; no provider calls and no repository writes."

  record:
    if: github.event_name != 'pull_request'
    name: Record original smoothing run receipt
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Find and await the original push run
        id: locate
        shell: bash
        run: |
          target_json="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow phase4-php4-010-020-human-smoothing.yml --limit 20 --json databaseId,number,event,status,conclusion,headSha,url,createdAt,updatedAt --jq '[.[] | select(.event == "push")] | sort_by(.number) | last')"
          target_id="$(jq -r '.databaseId // empty' <<<"$target_json")"
          test -n "$target_id"
          gh run watch "$target_id" --repo "$GITHUB_REPOSITORY" --exit-status || true
          gh run view "$target_id" --repo "$GITHUB_REPOSITORY" --json databaseId,number,event,status,conclusion,headSha,url,createdAt,updatedAt > config/latest_php4_010_020_smoothing_run.json
          echo "run_id=$target_id" >> "$GITHUB_OUTPUT"
      - name: Commit stable smoothing receipt
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- config/latest_php4_010_020_smoothing_run.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Record Philippians 4:10-20 smoothing run ${{ steps.locate.outputs.run_id }}"
          git push origin HEAD:main
