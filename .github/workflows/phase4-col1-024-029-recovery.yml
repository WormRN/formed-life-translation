name: FLT Engine 2.2 Colossians 1:24-29 bounded recovery
run-name: Colossians 1:24-29 preserved-checkpoint recovery

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/phase4-col1-024-029-recovery.yml'
      - 'phase4-harness/scripts/recover-col1-024-029.mjs'
      - 'config/passages/COL-01-024-029.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase4-col1-024-029-recovery.yml'

permissions:
  contents: write
  actions: read

concurrency:
  group: flt-col-01-024-029-recovery
  cancel-in-progress: false

env:
  TASK_ID: COL-01-024-029-BLIND-DRAFT-01
  AUTHORIZATION_ID: HE-COL-01-024-029-RECOVER-20260811
  LAUNCH_NONCE: HE-COL-01-024-029-RECOVERY-20260811-02
  EXPECTED_MANIFEST_REVISION: '5'
  PRIOR_ARTIFACT_ID: '9122291043'
  PRIOR_ARTIFACT_SHA256: aafbf075726530e58008a0629fa9859ec5e6c52f61366b09f89191d7cfb1cb08

jobs:
  validate:
    if: github.event_name == 'pull_request'
    name: Validate preserved-checkpoint recovery — zero provider calls
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: phase4-harness/package-lock.json
      - name: Validate recovery state, prior artifact, and actual recovery code path
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          jq -e --arg task "$TASK_ID" --arg auth "$AUTHORIZATION_ID" --arg nonce "$LAUNCH_NONCE" --argjson rev "$EXPECTED_MANIFEST_REVISION" '
            .manifest_revision==$rev and .unit.unit_id=="COL-01-024-029" and .unit.engine_version=="2.2" and
            .state.status=="ready" and .state.active_job_id==null and .state.provider_dispatch_allowed==true and
            .jobs[$task].status=="authorized_ready" and .jobs[$task].authorization_id==$auth and
            .jobs[$task].provider_attempts_used==4 and .jobs[$task].provider_attempts_remaining==4 and
            .jobs[$task].checkpoints_to_restore==2 and .jobs[$task].max_attempts_per_worker==2 and .jobs[$task].task_max_attempts==8 and
            .jobs[$task].launch.nonce==$nonce and .jobs[$task].launch.status=="armed" and .jobs[$task].launch.expected_manifest_revision==$rev
          ' config/passages/COL-01-024-029.json
          npm --prefix phase4-harness ci
          npm --prefix phase4-harness test
          node --check phase4-harness/scripts/recover-col1-024-029.mjs
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${PRIOR_ARTIFACT_ID}/zip" > /tmp/prior.zip
          echo "${PRIOR_ARTIFACT_SHA256}  /tmp/prior.zip" | sha256sum -c -
          mkdir -p /tmp/prior && unzip -q /tmp/prior.zip -d /tmp/prior
          prior_root="$(find /tmp/prior -mindepth 1 -maxdepth 1 -type d | head -1)"
          run_id="FLT-COL-01-RECOVERY-PREFLIGHT-${GITHUB_RUN_ID}"
          node phase4-harness/scripts/prepare-run-config.mjs phase4-harness/config.github-actions.json /tmp/recovery-config.json "$run_id"
          jq --arg task "$TASK_ID" '.unit_id="COL-01-024-029" | .source_packet="../docs/architecture/phase-4/COL-01-024-029_blind-source-v2.2.json" | .task_id=$task | .max_attempts=2 | .task_max_attempts=8 | .timeout_ms=300000' /tmp/recovery-config.json > /tmp/recovery-config2.json
          node phase4-harness/scripts/recover-col1-024-029.mjs /tmp/recovery-config2.json /tmp/recovery-preflight docs/architecture/phase-4/COL-01-024-029_blind-source-v2.2.json "$prior_root" --preflight-only
          jq -e '.status=="pass" and .reconciled_attempts_used==4 and .provider_attempts_reserved==0 and .provider_calls_made==0' /tmp/recovery-preflight/manifest/recovery-preflight.json

  claim_running:
    if: >-
      github.event_name == 'push' &&
      !startsWith(github.event.head_commit.message, 'Record Colossians 1:24-29 recovery running') &&
      !startsWith(github.event.head_commit.message, 'Record Colossians 1:24-29 recovery completion') &&
      !startsWith(github.event.head_commit.message, 'Record Colossians 1:24-29 recovery halt')
    name: Claim one-shot recovery before credentials
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      target_sha: ${{ steps.claim.outputs.target_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Credential-free recovery gate and running-state claim
        id: claim
        shell: bash
        run: |
          set -euo pipefail
          jq -e --arg task "$TASK_ID" --arg auth "$AUTHORIZATION_ID" --arg nonce "$LAUNCH_NONCE" --argjson rev "$EXPECTED_MANIFEST_REVISION" '
            .manifest_revision==$rev and .state.status=="ready" and .state.active_job_id==null and
            .jobs[$task].status=="authorized_ready" and .jobs[$task].authorization_id==$auth and
            .jobs[$task].provider_attempts_used==4 and .jobs[$task].checkpoints_to_restore==2 and
            .jobs[$task].launch.nonce==$nonce and .jobs[$task].launch.status=="armed" and .jobs[$task].launch.consumed_run_id==null
          ' config/passages/COL-01-024-029.json
          jq --arg task "$TASK_ID" --arg run "$GITHUB_RUN_ID" --arg nonce "$LAUNCH_NONCE" '
            .manifest_revision=6 |
            .state.status="running" |
            .state.phase="blind_draft_recovery_running" |
            .state.active_job_id=$task |
            .state.active_run_id=$run |
            .state.provider_dispatch_allowed=false |
            .state.github_workflow_dispatch_allowed=false |
            .state.next_permitted_action="await verified bounded recovery completion or halt" |
            .allowed_actions=["flt status COL-01-024-029","read_only_repository_inspection"] |
            .jobs[$task].status="running_recovery" |
            .jobs[$task].remote_run_id=$run |
            .jobs[$task].dispatch_confirmed=true |
            .jobs[$task].retry_allowed=false |
            .jobs[$task].launch.status="consumed" |
            .jobs[$task].launch.consumed_run_id=$run |
            .jobs[$task].launch.consumed_nonce=$nonce
          ' config/passages/COL-01-024-029.json > /tmp/manifest.json
          mv /tmp/manifest.json config/passages/COL-01-024-029.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- config/passages/COL-01-024-029.json
          git commit -m "Record Colossians 1:24-29 recovery running ${GITHUB_RUN_ID}"
          git push origin HEAD:main
          echo "target_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  recover:
    needs: claim_running
    if: needs.claim_running.result == 'success'
    name: Recover two siblings and make one final Greek-fidelity call
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.claim_running.outputs.target_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: phase4-harness/package-lock.json
      - name: Install harness dependencies
        run: npm --prefix phase4-harness ci
      - name: Restore prior artifact and verify digest
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${PRIOR_ARTIFACT_ID}/zip" > /tmp/prior.zip
          echo "${PRIOR_ARTIFACT_SHA256}  /tmp/prior.zip" | sha256sum -c -
          mkdir -p phase4-harness/prior-recovery
          unzip -q /tmp/prior.zip -d phase4-harness/prior-recovery
      - name: Prepare bounded recovery identity
        id: run
        shell: bash
        run: |
          set -euo pipefail
          run_id="FLT-COL-01-$(date -u +%Y%m%d)-${GITHUB_RUN_NUMBER}-recovery"
          node phase4-harness/scripts/prepare-run-config.mjs phase4-harness/config.github-actions.json phase4-harness/.col1-024-029-recovery-config.json "$run_id"
          jq --arg task "$TASK_ID" '.unit_id="COL-01-024-029" | .source_packet="../docs/architecture/phase-4/COL-01-024-029_blind-source-v2.2.json" | .task_id=$task | .max_attempts=2 | .task_max_attempts=8 | .timeout_ms=300000' phase4-harness/.col1-024-029-recovery-config.json > /tmp/config.json
          mv /tmp/config.json phase4-harness/.col1-024-029-recovery-config.json
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
      - name: Recover preserved candidates and execute only Greek-fidelity attempt 2
        shell: bash
        run: |
          set -euo pipefail
          prior_root="$(find phase4-harness/prior-recovery -mindepth 1 -maxdepth 1 -type d | head -1)"
          node phase4-harness/scripts/recover-col1-024-029.mjs phase4-harness/.col1-024-029-recovery-config.json "phase4-harness/runs/${{ steps.run.outputs.run_id }}" docs/architecture/phase-4/COL-01-024-029_blind-source-v2.2.json "$prior_root"
      - name: Upload recovered blind-candidate bundle and reconciled ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "${{ steps.run.outputs.run_id || 'FLT-COL-01-024-029-recovery-halted' }}"
          path: phase4-harness/runs/
          retention-days: 30

  record_completion:
    needs: [claim_running, recover]
    if: needs.claim_running.result == 'success' && needs.recover.result == 'success'
    name: Record recovered A/B/C completion for Human Editor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Advance durable state to Human Editor review
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          jq -e --arg task "$TASK_ID" --arg run "$GITHUB_RUN_ID" '.manifest_revision==6 and .state.status=="running" and .state.active_job_id==$task and .state.active_run_id==$run' config/passages/COL-01-024-029.json
          jq --arg task "$TASK_ID" --arg run "$GITHUB_RUN_ID" '
            .manifest_revision=7 |
            .state.status="awaiting_human_editor" |
            .state.phase="blind_draft_recovery_complete" |
            .state.active_job_id=null |
            .state.active_run_id=$run |
            .state.candidate_generation_allowed=false |
            .state.provider_dispatch_allowed=false |
            .state.github_workflow_dispatch_allowed=false |
            .state.next_permitted_action="retrieve verified recovered blind-candidate artifact and present untouched A/B/C candidates verse by verse" |
            .allowed_actions=["flt status COL-01-024-029","retrieve verified recovered blind-candidate artifact","read_only_repository_inspection"] |
            .jobs[$task].status="awaiting_human_editor" |
            .jobs[$task].provider_attempts_used=5 |
            .jobs[$task].provider_attempts_remaining=3 |
            .jobs[$task].checkpoints_to_restore=0 |
            .jobs[$task].retry_allowed=false |
            .jobs[$task].recovery_completed_run_id=$run
          ' config/passages/COL-01-024-029.json > /tmp/manifest.json
          mv /tmp/manifest.json config/passages/COL-01-024-029.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- config/passages/COL-01-024-029.json
          git commit -m "Record Colossians 1:24-29 recovery completion ${GITHUB_RUN_ID}"
          git push origin HEAD:main

  record_halt:
    needs: [claim_running, recover]
    if: always() && needs.claim_running.result == 'success' && needs.recover.result != 'success'
    name: Record recovery halt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Return unit to blocked without further calls
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          jq --arg task "$TASK_ID" --arg run "$GITHUB_RUN_ID" '
            .manifest_revision=7 |
            .state.status="blocked" |
            .state.phase="blind_draft_recovery_halted" |
            .state.active_job_id=null |
            .state.active_run_id=$run |
            .state.candidate_generation_allowed=false |
            .state.provider_dispatch_allowed=false |
            .state.github_workflow_dispatch_allowed=false |
            .state.next_permitted_action="inspect verified recovery halt evidence; new Human Editor unlock required" |
            .allowed_actions=["flt status COL-01-024-029","read_only_repository_inspection"] |
            .jobs[$task].status="blocked" |
            .jobs[$task].provider_attempts_used=5 |
            .jobs[$task].provider_attempts_remaining=3 |
            .jobs[$task].retry_allowed=false
          ' config/passages/COL-01-024-029.json > /tmp/manifest.json
          mv /tmp/manifest.json config/passages/COL-01-024-029.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- config/passages/COL-01-024-029.json
          git commit -m "Record Colossians 1:24-29 recovery halt ${GITHUB_RUN_ID}"
          git push origin HEAD:main
