name: FLT Engine 2.2 Colossians 1:1-14 blind candidates batch 02
run-name: Colossians 1:1-14 manifest-authorized blind A/B/C batch 02

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/phase4-col1-001-014-sense-drafts-batch-02.yml'
      - 'config/passages/COL-01-001-014.json'
      - 'config/COL-01-001-014_blind-draft-preflight-v02.json'
      - 'phase4-harness/scripts/prepare-run-config.mjs'
      - 'docs/architecture/phase-4/FLT_Autonomous_Circuit_Breaker_v1.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase4-col1-001-014-sense-drafts-batch-02.yml'
      - 'config/passages/COL-01-001-014.json'
      - 'config/COL-01-001-014_blind-draft-preflight-v02.json'
      - 'phase4-harness/scripts/prepare-run-config.mjs'
      - 'docs/architecture/phase-4/FLT_Autonomous_Circuit_Breaker_v1.md'

permissions:
  contents: write

concurrency:
  group: flt-col-01-001-014-blind-batch-02
  cancel-in-progress: false

env:
  TASK_ID: COL-01-001-014-BLIND-DRAFT-BATCH-02
  AUTHORIZATION_ID: HE-COL-BATCH-02
  LAUNCH_NONCE: HE-COL-BATCH-02-AUTO-20260810-03
  EXPECTED_MANIFEST_REVISION: '10'

jobs:
  validate:
    if: github.event_name == 'pull_request'
    name: Validate npm-ci repaired Batch 02 with zero provider calls
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: phase4-harness/package-lock.json
      - name: Validate manifest, npm-ci repair, preflight, source packet, and harness without provider credentials
        shell: bash
        run: |
          set -euo pipefail
          jq -e --arg task "$TASK_ID" --arg auth "$AUTHORIZATION_ID" --arg nonce "$LAUNCH_NONCE" --argjson rev "$EXPECTED_MANIFEST_REVISION" '
            .manifest_revision == $rev and
            .unit.unit_id == "COL-01-001-014" and
            .unit.engine_version == "2.2" and
            .state.status == "ready" and
            .state.active_job_id == null and
            .state.provider_dispatch_allowed == true and
            .state.github_workflow_dispatch_allowed == true and
            .jobs[$task].status == "authorized_ready" and
            .jobs[$task].authorization_id == $auth and
            .jobs[$task].dispatch_allowed == true and
            .jobs[$task].preflight_status == "passed_zero_provider_calls" and
            .jobs[$task].provider_attempts_used == 0 and
            .jobs[$task].checkpoints_to_restore == 0 and
            .jobs[$task].prior_failed_runs[1].run_id == "31458004896" and
            .jobs[$task].prior_failed_runs[1].provider_calls_made == 0 and
            .jobs[$task].prior_failed_runs[1].checkpoints_created == 0 and
            .jobs[$task].launch.mode == "manifest_authorized_one_shot_push" and
            .jobs[$task].launch.nonce == $nonce and
            .jobs[$task].launch.status == "armed" and
            .jobs[$task].launch.expected_manifest_revision == $rev
          ' config/passages/COL-01-001-014.json
          jq -e --arg task "$TASK_ID" --arg auth "$AUTHORIZATION_ID" '
            .status == "passed_zero_provider_calls" and
            .provider_calls_made == 0 and
            .task_id == $task and
            .authorization_id == $auth and
            .authorized_provider_tasks == 3 and
            .max_attempts_per_worker == 2 and
            .task_max_attempts == 8 and
            .evidence.failed_run_id == "31458004896" and
            .evidence.provider_calls_in_failed_run == 0 and
            .evidence.checkpoints_from_failed_run == 0 and
            .checks.draft_job_setup_node_enabled == true and
            .checks.draft_job_npm_ci_before_chapter_units == true and
            .production_trigger == "manifest_authorized_one_shot_push" and
            .state_claim_gate_provider_secrets_available == false
          ' config/COL-01-001-014_blind-draft-preflight-v02.json
          jq -e '
            .chapter_id == "COL-01" and
            .units[0].unit_id == "COL-01-001-014" and
            (.units[0].verses | length) == 14 and
            .passage_sense_resolution.gate_version == "2.2" and
            .passage_sense_resolution.status == "complete_for_blind_drafting" and
            .passage_sense_resolution.visibility_attestation.source_side_only == true and
            .passage_sense_resolution.visibility_attestation.prior_flt_wording_absent == true and
            .passage_sense_resolution.visibility_attestation.prior_candidates_absent == true and
            .passage_sense_resolution.visibility_attestation.editor_benchmark_absent == true and
            .passage_sense_resolution.visibility_attestation.comparison_translations_absent == true
          ' docs/architecture/phase-4/COL-01-001-014_blind-source-v2.2.json
          node phase4-harness/scripts/prepare-run-config.mjs phase4-harness/config.github-actions.json /tmp/col.json FLT-COL-01-20260810-1
          npm --prefix phase4-harness ci
          npm --prefix phase4-harness test
          (cd phase4-harness && node --input-type=module -e "import('ajv').then(()=>process.exit(0)).catch(()=>process.exit(1))")

  claim_running:
    if: >-
      github.event_name == 'push' &&
      !startsWith(github.event.head_commit.message, 'Record Colossians batch 02 running state') &&
      !startsWith(github.event.head_commit.message, 'Record Colossians batch 02 completion') &&
      !startsWith(github.event.head_commit.message, 'Record Colossians batch 02 halt')
    name: Claim npm-ci repaired one-shot launch and record running state
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      target_sha: ${{ steps.claim.outputs.target_sha }}
      run_id: ${{ steps.claim.outputs.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: phase4-harness/package-lock.json
      - name: Credential-free final npm-ci repair gate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          jq -e --arg task "$TASK_ID" --arg auth "$AUTHORIZATION_ID" --arg nonce "$LAUNCH_NONCE" --argjson rev "$EXPECTED_MANIFEST_REVISION" '
            .manifest_revision == $rev and
            .state.status == "ready" and
            .state.active_job_id == null and
            .jobs[$task].status == "authorized_ready" and
            .jobs[$task].authorization_id == $auth and
            .jobs[$task].dispatch_allowed == true and
            .jobs[$task].preflight_status == "passed_zero_provider_calls" and
            .jobs[$task].provider_attempts_used == 0 and
            .jobs[$task].checkpoints_to_restore == 0 and
            .jobs[$task].launch.mode == "manifest_authorized_one_shot_push" and
            .jobs[$task].launch.nonce == $nonce and
            .jobs[$task].launch.status == "armed" and
            .jobs[$task].launch.consumed_run_id == null
          ' config/passages/COL-01-001-014.json
          jq -e '.status == "passed_zero_provider_calls" and .provider_calls_made == 0 and .evidence.failed_run_id == "31458004896" and .evidence.provider_calls_in_failed_run == 0 and .evidence.checkpoints_from_failed_run == 0 and .checks.draft_job_npm_ci_before_chapter_units == true and .production_trigger == "manifest_authorized_one_shot_push"' config/COL-01-001-014_blind-draft-preflight-v02.json
          npm --prefix phase4-harness ci
          npm --prefix phase4-harness test
      - name: Atomically consume repaired launch nonce and record running state
        id: claim
        shell: bash
        run: |
          set -euo pipefail
          jq --arg task "$TASK_ID" --arg run "$GITHUB_RUN_ID" --arg nonce "$LAUNCH_NONCE" '
            .manifest_revision = 11 |
            .state.status = "running" |
            .state.phase = "blind_draft_batch_02_npmci_repaired_running" |
            .state.active_job_id = $task |
            .state.active_run_id = $run |
            .state.github_workflow_dispatch_allowed = false |
            .state.next_permitted_action = "await verified npm-ci repaired Batch 02 completion or exact cancel" |
            .allowed_actions = ["flt status COL-01-001-014", "flt cancel COL-01-001-014 --job COL-01-001-014-BLIND-DRAFT-BATCH-02 --expected-revision 11", "read_only_repository_inspection"] |
            .jobs[$task].status = "running" |
            .jobs[$task].dispatch_confirmed = true |
            .jobs[$task].remote_run_id = $run |
            .jobs[$task].retry_allowed = false |
            .jobs[$task].launch.status = "consumed" |
            .jobs[$task].launch.consumed_run_id = $run |
            .jobs[$task].launch.consumed_nonce = $nonce
          ' config/passages/COL-01-001-014.json > config/passages/COL-01-001-014.json.tmp
          mv config/passages/COL-01-001-014.json.tmp config/passages/COL-01-001-014.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- config/passages/COL-01-001-014.json
          git commit -m "Record Colossians batch 02 running state ${GITHUB_RUN_ID}"
          git push origin HEAD:main
          echo "target_sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "run_id=$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"

  draft:
    needs: claim_running
    if: needs.claim_running.result == 'success'
    name: Three blind Engine 2.2 candidates for Colossians 1:1-14
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.claim_running.outputs.target_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: phase4-harness/package-lock.json
      - name: Install Engine 2.2 harness dependencies
        run: npm --prefix phase4-harness ci
      - name: Create bounded run identity
        id: run
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ needs.claim_running.outputs.target_sha }}"
          run_id="FLT-COL-01-$(date -u +%Y%m%d)-${GITHUB_RUN_NUMBER}"
          node phase4-harness/scripts/prepare-run-config.mjs phase4-harness/config.github-actions.json phase4-harness/.col1-001-014-config.json "$run_id"
          jq --arg task_id "$TASK_ID" '.unit_id="COL-01-001-014" | .source_packet="../docs/architecture/phase-4/COL-01-001-014_blind-source-v2.2.json" | .task_id=$task_id | .max_attempts=2 | .task_max_attempts=8 | .timeout_ms=300000' phase4-harness/.col1-001-014-config.json > phase4-harness/.col1-001-014-config.tmp
          mv phase4-harness/.col1-001-014-config.tmp phase4-harness/.col1-001-014-config.json
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
      - name: Run exactly three blind candidate tasks
        run: node phase4-harness/src/chapter-units.js phase4-harness/.col1-001-014-config.json "phase4-harness/runs/${{ steps.run.outputs.run_id }}" docs/architecture/phase-4/COL-01-001-014_blind-source-v2.2.json
      - name: Upload blind-candidate bundle and attempt ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "${{ steps.run.outputs.run_id || 'FLT-COL-01-001-014-batch-02-halted' }}"
          path: phase4-harness/runs/
          retention-days: 30

  record_completion:
    needs: [claim_running, draft]
    if: needs.claim_running.result == 'success' && needs.draft.result == 'success'
    name: Record Batch 02 completion for Human Editor review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Advance durable state to awaiting Human Editor
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          jq -e --arg task "$TASK_ID" --arg run "$GITHUB_RUN_ID" '.manifest_revision == 11 and .state.status == "running" and .state.active_job_id == $task and .state.active_run_id == $run and .jobs[$task].status == "running"' config/passages/COL-01-001-014.json
          jq --arg task "$TASK_ID" --arg run "$GITHUB_RUN_ID" '
            .manifest_revision = 12 |
            .state.status = "awaiting_human_editor" |
            .state.phase = "blind_draft_batch_02_complete" |
            .state.active_job_id = null |
            .state.active_run_id = $run |
            .state.candidate_generation_allowed = false |
            .state.provider_dispatch_allowed = false |
            .state.github_workflow_dispatch_allowed = false |
            .state.next_permitted_action = "retrieve verified Batch 02 artifact and present untouched A/B/C candidates verse by verse" |
            .allowed_actions = ["flt status COL-01-001-014", "retrieve verified Batch 02 artifact", "read_only_repository_inspection"] |
            .jobs[$task].status = "awaiting_human_editor" |
            .jobs[$task].remote_run_id = $run
          ' config/passages/COL-01-001-014.json > config/passages/COL-01-001-014.json.tmp
          mv config/passages/COL-01-001-014.json.tmp config/passages/COL-01-001-014.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- config/passages/COL-01-001-014.json
          git commit -m "Record Colossians batch 02 completion ${GITHUB_RUN_ID}"
          git push origin HEAD:main

  record_halt:
    needs: [claim_running, draft]
    if: always() && needs.claim_running.result == 'success' && needs.draft.result != 'success'
    name: Record Batch 02 halted state
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Advance durable state to blocked
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          jq -e --arg task "$TASK_ID" --arg run "$GITHUB_RUN_ID" '.manifest_revision == 11 and .state.status == "running" and .state.active_job_id == $task and .state.active_run_id == $run' config/passages/COL-01-001-014.json
          jq --arg task "$TASK_ID" --arg run "$GITHUB_RUN_ID" '
            .manifest_revision = 12 |
            .state.status = "blocked" |
            .state.phase = "blind_draft_batch_02_halted" |
            .state.active_job_id = null |
            .state.active_run_id = $run |
            .state.candidate_generation_allowed = false |
            .state.provider_dispatch_allowed = false |
            .state.github_workflow_dispatch_allowed = false |
            .state.next_permitted_action = "inspect verified Batch 02 halt evidence; Human Editor unlock required for any retry" |
            .allowed_actions = ["flt status COL-01-001-014", "read_only_repository_inspection"] |
            .jobs[$task].status = "blocked" |
            .jobs[$task].remote_run_id = $run |
            .jobs[$task].retry_allowed = false
          ' config/passages/COL-01-001-014.json > config/passages/COL-01-001-014.json.tmp
          mv config/passages/COL-01-001-014.json.tmp config/passages/COL-01-001-014.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- config/passages/COL-01-001-014.json
          git commit -m "Record Colossians batch 02 halt ${GITHUB_RUN_ID}"
          git push origin HEAD:main
