    eligible_count: 3
    blocking_defects: 0
  successful_job_alone_is_semantic_pass: false
  audit_alone_finalizes_candidate: false
  fallback_order:
    - "Read config/latest_audit_run.json."
    - "Use the connected GitHub Actions tools with the recorded run ID."
    - "Retrieve the recorded artifact and audit summary."
    - "Ask the user for a run link only if connected repository retrieval is unavailable."

workflow_requirements:
  blind_candidates_share_one_constitutional_goal: true
  role_specific_readability_fidelity_balanced_goals_forbidden: true
  exact_candidate_must_be_preserved: true
  publish_latest_audit_receipt: true
