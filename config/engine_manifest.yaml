schema_version: 1
last_updated: "2026-07-23"
project:
  name: "Formed Life Translation"
  repository: "WormRN/formed-life-translation"
  source_text: "SBLGNT"
engine:
  name: "FLT Translation Engine"
  version: "2.0"
  phase: 4
  translation_identity: "dynamic equivalence"
  target_reader: "religion-naive adult or older adolescent near a sixth-grade reading level"
  common_candidate_goal: true
  candidate_mapping:
    A: "Claude Sonnet"
    B: "GPT-5.6 Sol"
    C: "Gemini Pro"

bootstrap:
  required_entry_file: "docs/START_HERE.md"
  stop_if_unavailable: true
  prohibit_chat_memory_reconstruction: true
  prohibit_version_1_substitution: true
  required_read_order:
    - "docs/START_HERE.md"
    - "config/engine_manifest.yaml"
    - "config/latest_audit_run.json"
    - "relevant governing documents"
    - "current unit files"

authority:
  final_decision_maker: "human_editor"
  orchestration_boss: "primary_assistant"
  worker_and_checker_role: "evidence_only"
  exact_candidate_sealed_for_audit: true
  silent_pre_audit_repair_forbidden: true
  audit_may_finalize: false
  boss_may_finalize: false
  rules:
    - "The human editor owns wording, repairs, acceptance, rejection, and finalization."
    - "The primary assistant orchestrates Engine 2.0 and may recommend, but may not substitute its preference for the human-selected candidate."
    - "A request to run checks means the next Engine 2.0 checkpoint, not a boss-only editorial opinion."
    - "Workers and auditors may flag concerns and alternatives but may not change the candidate or issue the final decision."

governing_documents:
  - "docs/current/FLT_translation_philosophy_revision_brief_v2.0.md"
  - "docs/current/FLT_constitution_v2.0.md"
  - "docs/current/FLT_style_guide_v2.0.md"
  - "docs/current/FLT_contextual_lexical_matrix_v2.0.md"
  - "docs/current/FLT_copyright_independence_policy_v2.0.md"
  - "docs/current/FLT_translation_packet_template_v2.0.md"
  - "logs/FLT_decision_log.md"

