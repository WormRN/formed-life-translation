schema_version: 1
last_updated: "2026-08-02"
project:
  name: "Formed Life Translation"
  repository: "WormRN/formed-life-translation"
  source_text: "SBLGNT"
engine:
  name: "FLT Translation Engine"
  version: "2.2"
  phase: 4
  translation_identity: "dynamic equivalence"
  target_reader: "religion-naive adult or older adolescent near a sixth-grade reading level"
  common_candidate_goal: true
  candidate_mapping:
    A: "Claude Sonnet"
    B: "GPT-5.6 Sol"
    C: "Gemini Pro"
  one_hearing_oral_english_required: true
  oral_english_smoothing_gate: true
  passage_sense_resolution_gate: true
  passage_sense_sequence:
    - "map passage argument and verse propositions without drafting English"
    - "resolve discourse-dependent expressions and retain genuinely viable alternatives"
    - "separate reading-text guidance from literal-note guidance"
    - "validate blindness and give all three candidates the identical semantic brief"
    - "record candidate alternatives in the review apparatus, not the reading text"
    - "audit reading text and required transparency notes together"
  smoothing_sequence:
    - "listener-only diagnosis"
    - "source-aware logged proposals"
    - "human approval of exact wording"
    - "expanded exact-candidate semantic audit"
  copyright_protocol:
    status: "deferred_batch_audit_adopted"
    heuristic_timing: "after independent wording is recorded"
    heuristic_scope: "obvious highly distinctive multiword or dynamic interpretive resemblance only"
    first_draft_status: "DEFERRED_BATCH"
    hard_audit_timing: "after the New Testament first draft is complete"
    planned_access: "authorized paid API retrieval through API.Bible where available and likely the official ESV API separately"
    publication_gate: "HARD_CHECK_COMPLETE required for the exact release text"
    recheck_after_post_audit_change: true

bootstrap:
  required_entry_file: "docs/START_HERE.md"
  stop_if_unavailable: true
  prohibit_chat_memory_reconstruction: true
  prohibit_version_1_substitution: true
  required_read_order:
    - "docs/START_HERE.md"
    - "config/engine_manifest.yaml"
    - "config/latest_audit_run.json"
    - "relevant governing documents"
    - "current unit files"

authority:
  final_decision_maker: "human_editor"
  orchestration_boss: "primary_assistant"
  worker_and_checker_role: "evidence_only"
  exact_candidate_sealed_for_audit: true
  silent_pre_audit_repair_forbidden: true
  audit_may_finalize: false
  boss_may_finalize: false
  rules:
    - "The human editor owns wording, repairs, acceptance, rejection, and finalization."
    - "The primary assistant orchestrates Engine 2.0 and may recommend, but may not substitute its preference for the human-selected candidate."
    - "A request to run checks means the next Engine 2.0 checkpoint, not a boss-only editorial opinion."
    - "Workers and auditors may flag concerns and alternatives but may not change the candidate or issue the final decision."

governing_documents:
  - "docs/current/FLT_translation_philosophy_revision_brief_v2.0.md"
  - "docs/current/FLT_constitution_v2.0.md"
  - "docs/current/FLT_style_guide_v2.0.md"
  - "docs/current/FLT_contextual_lexical_matrix_v2.0.md"
  - "docs/current/FLT_copyright_independence_policy_v2.0.md"
  - "docs/current/FLT_translation_packet_template_v2.0.md"
  - "docs/architecture/phase-4/engine-2.2-passage-sense-gate.md"
  - "logs/FLT_decision_log.md"

